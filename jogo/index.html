<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Aquipólis Tycoon — simulação educativa de gestão cooperativa da Rota da Tilápia (UPA · UBP · UPP) e da governança participativa do GAO — adaptável a qualquer município." />
<meta name="theme-color" content="#07151a" />
<title>Aquipólis Tycoon — A Rota da Tilápia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307151a'/%3E%3Cpath d='M10 33c7-12 22-15 32-7l10-7v28l-10-7c-10 8-25 5-32-7z' fill='%2326e2cf'/%3E%3Ccircle cx='21' cy='31' r='2.6' fill='%2307151a'/%3E%3C/svg%3E" />
<!-- Aquipólis Tycoon v1.1 — município configurável (sem referências regionais fixas), aviso chamativo de despesca,
     Modo decisões (demandas do dia que mudam o cenário) e governança do Estatuto do GAO (eleição, obra acompanhada,
     reuniões, votação por maioria, atas, devolutivas, mural de transparência e conselhos CAE/CFE).
     Aquipólis Tycoon v1.0 — edição profissional (base Rev. 18.3).
     Novidades: tela de carregamento, menu principal, salvar/continuar (localStorage), menu de pausa,
     configurações (gráficos, áudio, interface), ícones vetoriais, dicas ao passar o mouse,
     atalhos de teclado, balanço mensal com gráfico e relatório final com pontuação.
     Qualidade gráfica: objeto GFX (topo do script) + Configurações no jogo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#07151a; --ink2:#0c2027; --panel:#0e272f; --panel2:#123540;
    --line:#1c4651; --aqua:#26e2cf; --mint:#7df0a6; --amber:#f5b13d;
    --coral:#ff6b5e; --sand:#d9c39a; --txt:#dff4f3; --txt-dim:#8fb8b8; --txt-mut:#5d8488;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--ink);overscroll-behavior:none;
    position:fixed;width:100%;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%;touch-action:none;
    font-family:"Saira Semi Condensed",system-ui,sans-serif;color:var(--txt);}
  canvas{touch-action:none;}
  button{touch-action:manipulation;}
  #app{position:fixed;inset:0;} canvas{display:block;}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}

  #hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:stretch;
    padding:10px 12px;pointer-events:none;z-index:20;
    background:linear-gradient(180deg,rgba(7,21,26,.94),rgba(7,21,26,0));}
  .brand{pointer-events:auto;display:flex;flex-direction:column;justify-content:center;padding:2px 12px 2px 2px;}
  .brand b{font-size:17px;letter-spacing:.4px;font-weight:800;}
  .brand b span{color:var(--aqua);}
  .brand small{font-size:10px;color:var(--txt-mut);letter-spacing:1.4px;text-transform:uppercase;}
  .stats{pointer-events:auto;display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;min-width:92px;}
  .stat .k{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--txt-mut);}
  .stat .v{font-size:15px;font-weight:700;margin-top:1px;}
  .stat .v small{font-size:9.5px;color:var(--txt-dim);font-weight:400;}
  .stat.bad .v{color:var(--coral);} .stat.warn .v{color:var(--amber);} .stat.good .v{color:var(--mint);}
  .bar{height:4px;border-radius:3px;background:#0a2026;margin-top:4px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--aqua);transition:width .25s;}
  #time{pointer-events:auto;display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:5px 8px;}
  #time .date{font-size:12.5px;font-weight:700;min-width:126px;text-align:center;}
  .spd{display:flex;gap:3px;}
  .spd button{width:28px;height:25px;border:1px solid var(--line);background:var(--ink2);color:var(--txt-dim);
    border-radius:6px;font-weight:700;cursor:pointer;font-size:11px;}
  .spd button.on{background:var(--aqua);color:#03171a;border-color:var(--aqua);}

  #tools{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);display:flex;gap:5px;z-index:20;
    background:rgba(9,28,33,.88);border:1px solid var(--line);border-radius:14px;padding:7px;backdrop-filter:blur(6px);}
  .tool{display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;padding:6px 3px 4px;
    border-radius:10px;cursor:pointer;border:1px solid transparent;color:var(--txt-dim);user-select:none;}
  .tool:hover{background:var(--panel2);color:var(--txt);}
  .tool.on{background:var(--aqua);color:#03171a;border-color:var(--aqua);}
  .tool .ico{font-size:19px;line-height:1;} .tool .lb{font-size:10px;font-weight:600;text-align:center;}

  .panel{position:absolute;z-index:18;background:rgba(12,38,46,.95);border:1px solid var(--line);
    border-radius:14px;padding:14px;backdrop-filter:blur(8px);}
  #inspect{top:74px;right:12px;width:280px;display:none;} #inspect.show{display:block;}
  #inspect h3{font-size:15px;display:flex;align-items:center;gap:7px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  #inspect .sub{font-size:11px;color:var(--txt-mut);margin:1px 0 11px;}
  .row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-top:1px solid #103039;}
  .row span:first-child{color:var(--txt-dim);} .row b{font-weight:700;}
  .mini{height:5px;border-radius:3px;background:#0a2026;margin:6px 0 2px;overflow:hidden;}
  .mini i{display:block;height:100%;border-radius:3px;}
  .acts{display:flex;flex-direction:column;gap:6px;margin-top:11px;}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:9px;padding:9px;
    font-weight:700;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;
    align-items:center;font-family:inherit;width:100%;}
  .btn:hover{border-color:var(--aqua);} .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.primary{background:var(--aqua);color:#03171a;border-color:var(--aqua);}
  .btn small{font-weight:400;color:var(--txt-mut);} .btn.primary small{color:#0a3d39;}

  /* Cooperados / Equipes */
  #teams{top:74px;left:12px;width:308px;display:none;max-height:calc(100vh - 180px);overflow:auto;} #teams.show{display:block;}
  #teams h3{font-size:15px;margin-bottom:2px;} #teams .sub{font-size:11px;color:var(--txt-mut);margin-bottom:10px;}
  .pool{display:flex;align-items:center;gap:6px;background:var(--ink2);border:1px solid var(--line);
    border-radius:9px;padding:7px 10px;margin-bottom:9px;font-size:12.5px;}
  .pool b{font-size:17px;color:var(--aqua);} .pool .ppl{flex:1;font-size:16px;letter-spacing:1px;color:var(--mint);overflow:hidden;}
  .fn{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;}
  .fn .fi{font-size:20px;width:26px;text-align:center;}
  .fn .ft{flex:1;} .fn .ft b{font-size:13px;} .fn .ft p{font-size:10.5px;color:var(--txt-dim);line-height:1.3;margin-top:1px;}
  .fn .ft .eff{font-size:10px;margin-top:2px;}
  .stepper{display:flex;align-items:center;gap:4px;}
  .stepper button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--ink2);
    color:var(--txt);font-weight:700;cursor:pointer;font-size:14px;}
  .stepper button:hover{border-color:var(--aqua);} .stepper button:disabled{opacity:.3;cursor:not-allowed;}
  .stepper .n{width:24px;text-align:center;font-weight:700;font-size:15px;}

  #log{position:absolute;left:12px;bottom:13px;width:320px;max-height:170px;z-index:17;
    display:flex;flex-direction:column-reverse;gap:5px;overflow:hidden;pointer-events:none;}
  .toast{background:rgba(12,38,46,.92);border:1px solid var(--line);border-left-width:3px;border-radius:8px;
    padding:7px 10px;font-size:11.5px;line-height:1.35;animation:rise .3s ease;}
  .toast.good{border-left-color:var(--mint);} .toast.warn{border-left-color:var(--amber);}
  .toast.bad{border-left-color:var(--coral);} .toast.info{border-left-color:var(--aqua);}
  .toast b{color:var(--txt);} .toast .t{color:var(--txt-mut);font-size:10px;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  #modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(3,11,14,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:18px;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease, visibility .45s ease;}
  #modal.show{opacity:1;visibility:visible;pointer-events:auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:580px;width:100%;
    padding:24px 26px;max-height:90vh;overflow:auto;
    opacity:0;transform:translateY(16px) scale(.99);transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);}
  #modal.show .card{opacity:1;transform:none;}
  .card h2{font-size:22px;margin-bottom:3px;} .card h2 span{color:var(--aqua);}
  .card .lead{color:var(--txt-dim);font-size:13.5px;line-height:1.55;margin-bottom:15px;}
  .build-item{display:flex;gap:11px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;}
  .build-item .bi-ico{font-size:24px;width:38px;text-align:center;}
  .build-item .bi-txt{flex:1;} .build-item .bi-txt b{font-size:13.5px;}
  .build-item .bi-txt p{font-size:11px;color:var(--txt-dim);margin-top:2px;line-height:1.35;}
  .helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;margin:13px 0;font-size:12px;}
  .helpgrid div{color:var(--txt-dim);} .helpgrid b{color:var(--aqua);}
  .close-x{float:right;cursor:pointer;color:var(--txt-mut);font-size:21px;line-height:1;margin:-4px -4px 0 0;}
  .close-x:hover{color:var(--txt);}

  #exitView{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:19;display:none;
    background:rgba(9,28,33,.92);border:1px solid var(--aqua);border-radius:10px;padding:8px 14px;
    cursor:pointer;font-weight:700;font-size:13px;color:var(--aqua);}
  #exitView.show{display:block;}
  #hint{position:absolute;bottom:78px;left:12px;z-index:16;background:rgba(12,38,46,.9);border:1px solid var(--line);
    border-radius:10px;padding:7px 11px;font-size:11px;color:var(--txt-dim);max-width:300px;}
  #hint b{color:var(--aqua);} .kbd{font-family:"JetBrains Mono",monospace;background:#0a2026;
    border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10px;color:var(--txt);}
  #zoomctl{position:absolute;right:12px;bottom:88px;z-index:20;display:flex;flex-direction:column;gap:6px;}
  #zoomctl button{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);
    background:rgba(12,38,46,.92);color:var(--txt);font-size:22px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);line-height:1;}
  #zoomctl button:active{background:var(--aqua);color:#03171a;}
  @media (max-width:820px){
    #hud{padding:7px 8px;gap:6px;align-items:flex-start;}
    .brand small{display:none;} .brand b{font-size:15px;}
    .stats{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .stats::-webkit-scrollbar{display:none;}
    .stat{min-width:84px;padding:4px 8px;flex:0 0 auto;}
    .stat .v{font-size:13px;}
    #time{padding:4px 6px;} #time .date{min-width:96px;font-size:11px;}
    .spd button{width:24px;height:22px;}
    #tools{left:6px;right:6px;transform:none;bottom:8px;padding:6px;gap:3px;
      overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;scrollbar-width:none;}
    #tools::-webkit-scrollbar{display:none;}
    .tool{width:58px;flex:0 0 auto;padding:5px 2px 3px;}
    .tool .ico{font-size:17px;} .tool .lb{font-size:9px;}
    #teams{width:86vw;max-width:320px;left:7px;top:104px;max-height:60vh;}
    #inspect{width:78vw;max-width:280px;right:7px;top:104px;}
    #log{width:62vw;max-width:240px;bottom:74px;}
    #hint{display:none;} #ticker{top:54px;font-size:11px;}
    .card{padding:18px 16px;border-radius:14px;}
    #zoomctl{display:flex;}
  }
  @media (max-width:820px) and (max-height:520px){
    #tools{bottom:6px;} .tool .lb{display:none;} .tool{width:42px;}
  }

  /* ================= v1.0 — camada de acabamento profissional ================= */
  :root{ --uiz:1; --shadow:0 10px 40px -12px rgba(0,0,0,.55); --r:12px; }
  .i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
    vertical-align:-.14em;flex-shrink:0;}
  #hud,#tools,.panel,#modal .card,#zoomctl,#log,#time,#exitView{zoom:var(--uiz);}
  :focus-visible{outline:2px solid var(--aqua);outline-offset:2px;}
  .brand{flex-direction:row;align-items:center;gap:9px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#0f3a43,#0a252c);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--aqua);font-size:22px;flex-shrink:0;}
  .brand .bt{display:flex;flex-direction:column;line-height:1.05;}
  .brand .bt b{font-size:17px;letter-spacing:.3px;}
  .brand .bt b em{font-style:normal;color:var(--aqua);font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-left:4px;}
  .stat .k{display:flex;align-items:center;gap:5px;}
  .stat .k .i{font-size:12px;color:var(--aqua);opacity:.9;}
  .stat.bad .k .i{color:var(--coral);} .stat.warn .k .i{color:var(--amber);}
  .stat .bar i{background:linear-gradient(90deg,var(--aqua),var(--mint));}
  .stat.bad .bar i{background:var(--coral);} .stat.warn .bar i{background:var(--amber);}
  #hud{align-items:flex-start;}
  .brand{align-self:center;}
  .stats{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
  .stats::-webkit-scrollbar{display:none;}
  .stat{min-width:76px;flex:1 0 auto;padding:5px 8px;}
  .stat .k{letter-spacing:.4px;font-size:9px;} .stats{gap:5px;} #time .date{min-width:112px;}
  .spd button{width:26px;}
  .stat .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand .bt small{white-space:nowrap;}
  #time{flex-direction:column;align-items:stretch;gap:4px;padding:6px 8px 7px;flex-shrink:0;}
  .hbtn{height:44px;flex-shrink:0;}
  #hint{left:50%;right:auto;transform:translateX(-50%);bottom:96px;max-width:calc(100vw - 40px);white-space:nowrap;}
  @media (max-width:1560px){ .stat .v small{display:none;} .brand .bt small{display:none;} }
  #time .trow{display:flex;align-items:center;gap:7px;}
  #time .yr{height:3px;border-radius:2px;background:#0a2026;overflow:hidden;}
  #time .yr i{display:block;height:100%;background:var(--amber);transition:width .4s;}
  .spd button{display:flex;align-items:center;justify-content:center;font-size:13px;}
  .hbtn{pointer-events:auto;width:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .hbtn:hover{border-color:var(--aqua);color:var(--aqua);}
  .tool{position:relative;}
  .tool .ico{font-size:21px;height:22px;display:flex;align-items:center;}
  .tool .key{position:absolute;top:3px;right:5px;font:700 9px "JetBrains Mono",monospace;color:var(--txt-mut);opacity:.8;}
  .tool.on .key{color:#0a3d39;}
  @media (pointer:coarse){ .tool .key{display:none;} }
  #zoomctl button{font-size:19px;}
  #zoomctl button.on{border-color:var(--aqua);color:var(--aqua);}
  #modal .card{box-shadow:var(--shadow);}
  .toast{box-shadow:0 6px 18px -8px rgba(0,0,0,.6);}

  /* Tela de carregamento */
  #boot{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:radial-gradient(1200px 700px at 50% 35%,#0f2f37 0%,#07151a 60%);transition:opacity .7s ease,visibility .7s;}
  #boot.hide{opacity:0;visibility:hidden;}
  #boot .mark{width:84px;height:84px;border-radius:22px;background:linear-gradient(145deg,#12414b,#0a252c);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--aqua);font-size:52px;box-shadow:0 0 60px -10px rgba(38,226,207,.35);
    animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-6px);}}
  #boot h1{font-size:34px;font-weight:800;letter-spacing:.5px;}
  #boot h1 span{color:var(--aqua);}
  #boot .sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--txt-mut);margin-top:-12px;}
  #boot .track{width:240px;height:4px;border-radius:3px;background:#0c2530;overflow:hidden;position:relative;}
  #boot .track i{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--aqua),transparent);animation:slide 1.2s linear infinite;}
  @keyframes slide{from{transform:translateX(-100%);}to{transform:translateX(260%);}}
  #boot .st{font-size:12px;color:var(--txt-dim);min-height:16px;}

  /* Menu principal */
  #menu{position:fixed;inset:0;z-index:60;display:none;pointer-events:none;
    background:linear-gradient(90deg,rgba(5,16,20,.94) 0%,rgba(5,16,20,.78) 36%,rgba(5,16,20,0) 70%);}
  #menu.show{display:block;}
  #menu .mwrap{pointer-events:auto;position:absolute;left:clamp(20px,6vw,90px);top:50%;transform:translateY(-50%);
    width:min(420px,calc(100vw - 40px));animation:rise .6s ease;}
  #menu .kick{font:700 11px "JetBrains Mono",monospace;letter-spacing:2.5px;text-transform:uppercase;color:var(--aqua);margin-bottom:10px;}
  #menu h1{font-size:clamp(40px,6vw,62px);font-weight:800;line-height:.95;letter-spacing:-.5px;}
  #menu h1 span{display:block;color:var(--aqua);font-size:.46em;font-weight:600;letter-spacing:5px;text-transform:uppercase;margin-top:8px;}
  #menu p.lead{color:var(--txt-dim);font-size:14px;line-height:1.55;margin:16px 0 22px;max-width:380px;}
  .mbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;border-radius:12px;
    border:1px solid var(--line);background:rgba(14,39,47,.85);color:var(--txt);cursor:pointer;font:600 15px inherit;font-family:inherit;
    transition:border-color .15s,transform .15s,background .15s;}
  .mbtn:hover{border-color:var(--aqua);transform:translateX(3px);}
  .mbtn .i{font-size:19px;color:var(--aqua);}
  .mbtn small{display:block;font-weight:400;font-size:11.5px;color:var(--txt-mut);margin-top:1px;}
  .mbtn.primary{background:var(--aqua);color:#03171a;border-color:var(--aqua);}
  .mbtn.primary .i{color:#03171a;} .mbtn.primary small{color:#0a3d39;}
  #menu .foot{margin-top:18px;font-size:11px;color:var(--txt-mut);display:flex;gap:14px;flex-wrap:wrap;}
  #menu .foot a{color:var(--txt-dim);}
  @media (max-width:820px){ #menu{background:linear-gradient(180deg,rgba(5,16,20,.55),rgba(5,16,20,.94) 55%);}
    #menu .mwrap{top:auto;bottom:20px;transform:none;} #menu p.lead{display:none;} }

  /* Tooltip de hover */
  #tip{position:fixed;z-index:35;pointer-events:none;display:none;background:rgba(9,28,33,.96);border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.4;min-width:150px;box-shadow:var(--shadow);}
  #tip b{font-size:13px;} #tip .m{color:var(--txt-mut);font-size:11px;}
  #tip .mini{margin:4px 0 1px;}

  .seg{display:flex;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;}

window.addEventListener('error', function(ev){
  if(document.getElementById('fatalErr')) return;
  var msg = (ev && ev.message) ? ev.message : 'Erro desconhecido';
  if(ev && ev.filename && /three\.min\.js/.test(ev.filename)) msg = 'Falha ao carregar o motor 3D (Three.js). Verifique a conexão.';
  var d=document.createElement('div'); d.id='fatalErr';
  d.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;background:#07151a;color:#dff4f3;font-family:sans-serif';
  d.innerHTML='<div><div style="font-size:38px">🐟</div><h2 style="color:#26e2cf;margin:8px 0">Ops, algo travou ao abrir</h2>'+
    '<p style="color:#8fb8b8;max-width:440px;margin:8px auto;font-size:14px">'+msg+'</p>'+
    '<p style="color:#5d8488;font-size:12px;margin-top:10px">Toque para recarregar.</p></div>';
  d.onclick=function(){ location.reload(); };
  document.body.appendChild(d);
});
</script>

/* ---- Texturas procedurais em <canvas> (cache por chave) ---- */
const _texCache = {};
function _cv(sz=256){ const c=document.createElement('canvas'); c.width=c.height=sz; return c; }
function _finish(c, rep=4){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rep,rep); t.anisotropy=GFX.aniso; t.needsUpdate=true; return t; }
function texConcrete(){ if(_texCache.concrete)return _texCache.concrete; const c=_cv(256),x=c.getContext('2d');
  x.fillStyle='#b9bec2'; x.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){ const g=180+Math.random()*60|0; x.fillStyle=`rgba(${g},${g},${g},.08)`;
    x.fillRect(Math.random()*256,Math.random()*256,1,1); }
  x.strokeStyle='rgba(70,75,80,.5)'; x.lineWidth=2;                    // juntas de dilatação
  for(let i=64;i<256;i+=64){ x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();
    x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke(); }
  for(let i=0;i<5;i++){ x.fillStyle='rgba(60,66,70,.10)'; x.beginPath();       // manchas
    x.arc(Math.random()*256,Math.random()*256,10+Math.random()*26,0,7);x.fill(); }
  return _texCache.concrete=_finish(c,6); }
function texMetalRoof(){ if(_texCache.roof)return _texCache.roof; const c=_cv(128),x=c.getContext('2d');
  for(let i=0;i<128;i+=8){ const g=150+((i/8)%2?18:-12); x.fillStyle=`rgb(${g},${g+4},${g+8})`; x.fillRect(0,i,128,8); }
  x.fillStyle='rgba(90,60,45,.10)'; for(let i=0;i<40;i++) x.fillRect(Math.random()*128,Math.random()*128,2,6);
  return _texCache.roof=_finish(c,3); }
function texRoofBump(){ if(_texCache.roofB)return _texCache.roofB; const c=_cv(128),x=c.getContext('2d');
  for(let i=0;i<128;i+=8){ x.fillStyle=((i/8)%2)?'#fff':'#666'; x.fillRect(0,i,128,8); }
  return _texCache.roofB=_finish(c,3); }
function texInox(){ if(_texCache.inox)return _texCache.inox; const c=_cv(128),x=c.getContext('2d');
  x.fillStyle='#c8ced2'; x.fillRect(0,0,128,128);
  for(let i=0;i<128;i++){ const a=Math.random()*.12; x.strokeStyle=`rgba(255,255,255,${a})`;
    x.beginPath();x.moveTo(0,i);x.lineTo(128,i);x.stroke(); }
  return _texCache.inox=_finish(c,2); }
function texWater(){ if(_texCache.water)return _texCache.water; const c=_cv(256),x=c.getContext('2d');
  x.fillStyle='#0e5566'; x.fillRect(0,0,256,256);
  for(let i=0;i<60;i++){ x.strokeStyle=`rgba(180,235,245,${.05+Math.random()*.12})`; x.lineWidth=1+Math.random()*2;
    x.beginPath(); const cx=Math.random()*256,cy=Math.random()*256,r=8+Math.random()*30;
    x.arc(cx,cy,r,0,Math.PI*2); x.stroke(); }
  return _texCache.water=_finish(c,3); }
function texDirt(){ if(_texCache.dirt)return _texCache.dirt; const c=_cv(256),x=c.getContext('2d');
  x.fillStyle='#c2ad82'; x.fillRect(0,0,256,256);
  for(let i=0;i<3000;i++){ const b=Math.random()*40; x.fillStyle=`rgba(${120-b},${100-b},${70-b},.18)`;
    x.beginPath();x.arc(Math.random()*256,Math.random()*256,.5+Math.random()*2.5,0,7);x.fill(); }
  return _texCache.dirt=_finish(c,10); }
function texRadial(){ if(_texCache.radial)return _texCache.radial; const c=_cv(128),x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,4,64,64,64); g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); t.needsUpdate=true;
  return _texCache.radial=t; }

function contactShadow(cx,cz,radius){ if(!GFX.contactShadows)return;

function modPos(m){

}

function makeLabel(text,scale=8,color="#dff4f3",bg="rgba(7,21,26,.82)"){
  const c=document.createElement('canvas'),ctx=c.getContext('2d'),pad=16,fs=42;
  ctx.font=`700 ${fs}px Saira Semi Condensed, Arial`;
  const w=ctx.measureText(text).width; c.width=w+pad*2; c.height=fs+pad*2;
  ctx.font=`700 ${fs}px Saira Semi Condensed, Arial`;
  ctx.fillStyle=bg; rr(ctx,0,0,c.width,c.height,16); ctx.fill();
  ctx.fillStyle=color; ctx.textBaseline='middle'; ctx.fillText(text,pad,c.height/2);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  s.userData.isLabel=true; _labels.push(s);
  s.visible=GFX.showLabels;   // Rev.16: placas externas nascem conforme o toggle 🏷️
  s.scale.set(scale*c.width/c.height,scale,1); s.renderOrder=999; return s;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);
  x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}

function buildTerrain(){
  // polígono irregular do lote (a estrada de acesso corta o canto noroeste)
  const sh=new THREE.Shape();
  const P=[[-122,-115],[128,-115],[128,158],[-40,158],[-122,60]]; // lote irregular
  sh.moveTo(P[0][0],P[0][1]); for(let i=1;i<P.length;i++) sh.lineTo(P[i][0],P[i][1]); sh.closePath();
  const lote=new THREE.Mesh(new THREE.ShapeGeometry(sh), mat('#c2ad82',{roughness:1, map:(GFX.procTex?texDirt():null)}));
  lote.rotation.x=-Math.PI/2; lote.position.y=0; lote.receiveShadow=true; scene.add(lote);
  const grass=new THREE.Mesh(new THREE.PlaneGeometry(760,700), mat('#41553f',{roughness:1}));
  grass.rotation.x=-Math.PI/2; grass.position.y=-0.05; scene.add(grass);
  const plat=new THREE.Mesh(new THREE.PlaneGeometry(220,160), mat('#cdb896',{roughness:.95, map:(GFX.procTex?texConcrete():null)}));
  plat.rotation.x=-Math.PI/2; plat.position.set(0,0.02,40); plat.receiveShadow=true; scene.add(plat);

  // ESTRADA DE ACESSO — via municipal ao norte do lote
  const road=new THREE.Mesh(new THREE.PlaneGeometry(250,13), mat('#3c3f44',{roughness:1}));
  road.rotation.x=-Math.PI/2; road.position.set(0,0.04,-110); scene.add(road);
  for(let i=0;i<14;i++){ const l=new THREE.Mesh(new THREE.PlaneGeometry(5,.4),mat('#d9c66a'));
    l.rotation.x=-Math.PI/2; l.position.set(-110+i*16,0.06,-110); scene.add(l); }
  const rlab=makeLabel('🛣️ Estrada de acesso',6.5,'#d9e6e6'); rlab.position.set(-40,9,-110); scene.add(rlab);

  // estacionamento (entre estrada e prédio)
  const park=new THREE.Mesh(new THREE.PlaneGeometry(64,20), mat('#55585a',{roughness:1}));
  park.rotation.x=-Math.PI/2; park.position.set(-22,0.05,-92); scene.add(park);
  for(let i=0;i<9;i++){ const l=new THREE.Mesh(new THREE.PlaneGeometry(.3,8), mat('#cfd6cf'));
    l.rotation.x=-Math.PI/2; l.position.set(-50+i*6,0.06,-92); scene.add(l); }
  fac(-52,-100,4,4,4,'#6b7d6e','Guarita','🚪'); // portão/guarita na entrada
  fence(P);
}
function fence(P){
  const g=new THREE.Group(), pm=mat('#5a6660',{metalness:.3,roughness:.6});
  for(let s=0;s<P.length;s++){ const a=P[s], b=P[(s+1)%P.length];
    const len=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.round(len/7);
    for(let i=0;i<=n;i++){ const px=a[0]+(b[0]-a[0])*i/n, pz=a[1]+(b[1]-a[1])*i/n;
      const p=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,3,6),pm); p.position.set(px,1.5,pz); g.add(p);} }
  scene.add(g);
}

const RAS_ROWS=[2,32,62,92];                 // z central de cada fileira de módulos
function ribZ(m){ return RAS_ROWS[Math.floor(m/MOD_COLS)]-12; } // coletor ao norte da fileira
function buildModules(){
  const N=132;
  const wallG=new THREE.CylinderGeometry(TANK_R,TANK_R*.96,1.2,24,1,true);
  const waterG=new THREE.CircleGeometry(TANK_R*.92,28);
  waterGeo=waterG; waterBase=Float32Array.from(waterG.attributes.position.array);
  const sandG=new THREE.CircleGeometry(TANK_R+.7,24);
  const rimG=new THREE.TorusGeometry(TANK_R,.15,8,24);
  const coneG=new THREE.ConeGeometry(.5,1,7);
  const skirtG=new THREE.CylinderGeometry(TANK_R+.12,TANK_R+.34,.4,20,1,true);
  wallInst=new THREE.InstancedMesh(wallG,mat('#dfe6e3',{side:THREE.DoubleSide,roughness:.55,metalness:.05}),N);
  const _waterTex=GFX.procTex?texWater():null;
  waterInst=new THREE.InstancedMesh(waterG,new THREE.MeshStandardMaterial({roughness:.16,metalness:.25,emissive:'#072e38',emissiveIntensity:.4,map:_waterTex}),N);
  if(_waterTex) window.__waterTex=_waterTex;
  sandInst=new THREE.InstancedMesh(sandG,mat('#9c8a63',{roughness:1}),N);
  rimInst=new THREE.InstancedMesh(rimG,mat('#2fb6c4',{metalness:.45,roughness:.4}),N);
  coneInst=new THREE.InstancedMesh(coneG,mat('#4a6b73',{roughness:.6}),N);
  const skirtInst=new THREE.InstancedMesh(skirtG,mat('#7d8a86',{side:THREE.DoubleSide,roughness:.95}),N);
  skirtInst.receiveShadow=true;
  wallInst.castShadow=true; sandInst.receiveShadow=true;
  waterInst.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(N*3),3);
  scene.add(wallInst,waterInst,sandInst,rimInst,coneInst,skirtInst);

  // acumuladores de transformações p/ instâncias do RAS
  const supply=[], drain=[], joints=[], beds=[], waters=[], pumps=[], bios=[], plants=[];
  const up=new THREE.Vector3(0,1,0), dir=new THREE.Vector3(), q=new THREE.Quaternion();
  const PY=0.55;
  function seg(arr,x1,z1,x2,z2,r,y1,y2){ y1=(y1==null?PY:y1); y2=(y2==null?PY:y2);
    const p1=new THREE.Vector3(x1,y1,z1), p2=new THREE.Vector3(x2,y2,z2), len=p1.distanceTo(p2);
    if(len<1e-3)return; dir.subVectors(p2,p1).normalize(); q.setFromUnitVectors(up,dir);
    tmpO.position.copy(p1).lerp(p2,.5); tmpO.quaternion.copy(q); tmpO.scale.set(r,len,r);
    tmpO.updateMatrix(); arr.push(tmpO.matrix.clone()); }
  function node(x,z,r,y){ tmpO.position.set(x,(y==null?PY:y),z); tmpO.quaternion.identity();
    tmpO.scale.set(r,r,r); tmpO.updateMatrix(); joints.push(tmpO.matrix.clone()); }
  function pushT(arr,x,y,z,sx,sy,sz){ tmpO.position.set(x,y,z); tmpO.quaternion.identity();
    tmpO.scale.set(sx,sy,sz); tmpO.updateMatrix(); arr.push(tmpO.matrix.clone()); }

  // tanques + RAS por módulo
  for(let m=0;m<CFG.modules;m++){
    const mp=modPos(m); modWorld[m]=mp; const fz=mp.z+13;        // filtro ao sul do módulo
    for(let t=0;t<CFG.tanksPerModule;t++){
      const id=m*6+t, tl=tankLocal(t);
      const wx=mp.x+tl.x, wz=mp.z+tl.z; tankWorld[id]={x:wx,z:wz};
      setInst(wallInst,id,wx,.6,wz);
      setInst(skirtInst,id,wx,.2,wz);
      setInst(waterInst,id,wx,1.05,wz,-Math.PI/2);
      setInst(sandInst,id,wx,.03,wz,-Math.PI/2);
      setInst(rimInst,id,wx,1.2,wz,Math.PI/2);
      setInst(coneInst,id,wx+TANK_R+.8,.5,wz,Math.PI);
    }
    // --- DRENO: cada tanque -> manifold sul -> filtro ---
    T_LX.forEach(lx=>T_LZ.forEach(lz=> seg(drain, mp.x+lx, mp.z+lz, mp.x+lx, mp.z+8, .18) ));
    seg(drain, mp.x-9, mp.z+8, mp.x+9, mp.z+8, .2);              // manifold sul
    seg(drain, mp.x, mp.z+8, mp.x, fz-2, .22);                   // -> filtro
    // --- FILTRO RIZOSFÉRICO + biofiltro + bomba ---
    pushT(beds, mp.x,.6,fz, 1,1,1);
    pushT(waters, mp.x,1.2,fz, 1,1,1);
    for(let i=0;i<16;i++){ const px=mp.x-7+(i%8)*2, pz=fz+(i<8?-.8:.8), h=2.0+Math.random()*1.1;
      pushT(plants, px,1.2+h/2,pz, 1,h,1); }
    pushT(pumps, mp.x+9,.9,fz, 1,1,1);
    pushT(bios, mp.x-9,1.2,fz, 1,1,1);
    // --- RETORNO: bomba -> manifold norte -> tanques ---
    seg(supply, mp.x+9, fz, mp.x+9, mp.z-8, .2);                 // bomba -> norte
    seg(supply, mp.x-9, mp.z-8, mp.x+9, mp.z-8, .2);             // manifold norte
    T_LX.forEach(lx=>T_LZ.forEach(lz=> seg(supply, mp.x+lx, mp.z-8, mp.x+lx, mp.z+lz, .18) ));
    // --- INTERLIGAÇÃO com a rede principal (ramal da fileira) ---
    seg(supply, mp.x, mp.z-8, mp.x, ribZ(m), .26); node(mp.x, ribZ(m), .55);
    // rótulo do filtro (sprites compartilham 1 textura)
    const flab=ras_label(); flab.position.set(mp.x,4,fz); scene.add(flab);
  }

  // === REDE PRINCIPAL (interligando tudo) ===
  const r0=.85, r1=.6, r2=.42;
  RAS_ROWS.forEach((rz,ri)=>{ const z=rz-12, w=(ri===0?92:80);   // tronco/ribs por fileira
    seg(supply,-w,z, w,z, ri===0?r0:r2); node(0,z, ri===0?1.2:.95); });
  seg(supply, 0,-22, 0, ribZ(20), r1);                            // espinha central N->S
  node(0,-22,1.0);
  // poços artesianos -> tronco norte
  for(let i=0;i<G.wells;i++){ wellMesh(-108,-10+i*14,i+1); seg(supply,-108,-10+i*14, -92,-10, r1); }
  // reservatórios de reúso -> rede
  const resv=[[-100,30],[-100,90],[100,120],[95,30]];
  resv.forEach(s=>{ const rr=new THREE.Mesh(new THREE.BoxGeometry(14,1.6,14),
      new THREE.MeshStandardMaterial({color:'#1d4a55',roughness:.2,emissive:'#06222b',emissiveIntensity:.5}));
    rr.position.set(s[0],.8,s[1]); rr.receiveShadow=true; scene.add(rr);
    const tx=s[0]<0?-80:80, tz=RAS_ROWS.reduce((a,b)=>Math.abs(b-12-s[1])<Math.abs(a-12-s[1])?b:a)-12;
    seg(supply, s[0],s[1], tx,tz, r1); node(tx,tz,.7); });
  const rl=makeLabel('💧 Reservatórios de reúso',6); rl.position.set(-100,10,60); scene.add(rl);
  // casa de bombas (hub) no topo da espinha
  const hub=new THREE.Mesh(new THREE.BoxGeometry(7,3,5),mat('#3a525c',{metalness:.3})); hub.position.set(0,1.5,-22);
  hub.castShadow=true; scene.add(hub);
  const hl=makeLabel('⚙️ Casa de bombas / tratamento',5); hl.position.set(0,7,-22); scene.add(hl);

  // === MATERIAIS + INSTANCED MESHES (poucos draw calls) ===
  supplyPipeMat=new THREE.MeshStandardMaterial({color:'#2fb39e',roughness:.4,metalness:.2,emissive:'#0c3b35',emissiveIntensity:.45});
  const drainMat=new THREE.MeshStandardMaterial({color:'#2b6470',roughness:.55,metalness:.15,emissive:'#06222b',emissiveIntensity:.25});
  const jointMat=mat('#1f7f70',{metalness:.35,roughness:.4});
  const cylU=new THREE.CylinderGeometry(1,1,1,8);
  const sphU=new THREE.SphereGeometry(1,10,8);
  mkInst(cylU,drainMat,drain,false);
  mkInst(cylU,supplyPipeMat,supply,false);
  mkInst(sphU,jointMat,joints,false);
  mkInst(new THREE.BoxGeometry(16,1.2,4),mat('#5a4a30',{roughness:1}),beds,true);
  mkInst(new THREE.BoxGeometry(15,.3,3.2),new THREE.MeshStandardMaterial({color:'#274d2f',roughness:.3,emissive:'#0a2a18',emissiveIntensity:.35}),waters,false);
  mkInst(new THREE.ConeGeometry(.42,1,5),mat('#3f9d4f',{roughness:.9}),plants,false);
  mkInst(new THREE.BoxGeometry(2.2,1.8,2.2),mat('#39505a',{metalness:.4}),pumps,true);
  mkInst(new THREE.CylinderGeometry(1.3,1.3,2.4,12),mat('#5a6b66',{roughness:.6}),bios,true);

  [wallInst,waterInst,sandInst,rimInst,coneInst].forEach(o=>o.instanceMatrix.needsUpdate=true);
  refreshTanks();
}

  const im=new THREE.InstancedMesh(geo,material,mats.length);
  for(let i=0;i<mats.length;i++) im.setMatrixAt(i,mats[i]);
  im.instanceMatrix.needsUpdate=true; im.castShadow=!!cast; scene.add(im); return im; }

function buildVegetation(){
  const N=48;
  const trunkG=new THREE.CylinderGeometry(.45,.65,5,6);
  const folG=new THREE.IcosahedronGeometry(3.4,0);
  const trunkInst=new THREE.InstancedMesh(trunkG,mat('#5b4326',{roughness:1}),N);
  const cols=['#3f7d3a','#4f8f44','#356b34','#5a9a4a'];
  const folInst=new THREE.InstancedMesh(folG,mat('#46883f',{roughness:.95,flatShading:true}),N);
  folInst.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(N*3),3);
  if(!IS_MOBILE){ trunkInst.castShadow=true; folInst.castShadow=true; }
  const col=new THREE.Color(); let i=0, tries=0;
  while(i<N && tries<600){ tries++;
    const a=Math.random()*Math.PI*2, rx=118+Math.random()*26, rz=132+Math.random()*26;
    const x=Math.cos(a)*rx, z=22+Math.sin(a)*rz;
    if(Math.abs(x)<96 && z>-16 && z<150) continue;     // não invade a área de operação
    if(z>-12 && z<8 && x>-60 && x<60) continue;          // não em cima do prédio

function makeHuman(){
  const g=new THREE.Group();
  const skinM=mat('#c9a274',{roughness:.75});
  const pantM=mat('#33414a',{roughness:.85});
  const bootM=mat('#1d242a',{roughness:.7});
  const vestM=mat('#e2a13a',{roughness:.5,metalness:.05});   // recolorido por função
  const helmM=mat('#f5d23d',{roughness:.45});
  const darkM=mat('#222a30');
  const hipY=.95, legLen=.92, armLen=.86;
  // sombra falsa (grounding)
  const blob=new THREE.Mesh(new THREE.CircleGeometry(.55,14), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.2,depthWrite:false}));
  blob.rotation.x=-Math.PI/2; blob.position.y=.03; g.add(blob);
  // pernas — grupos com pivô no quadril
  function makeLeg(side){ const lg=new THREE.Group(); lg.position.set(.17*side,hipY,0);
    const thigh=new THREE.Mesh(new THREE.CylinderGeometry(.13,.1,legLen,8),pantM); thigh.position.y=-legLen/2; lg.add(thigh);
    const boot=new THREE.Mesh(new THREE.BoxGeometry(.22,.16,.34),bootM); boot.position.set(0,-legLen+.04,.06); lg.add(boot);
    g.add(lg); return lg; }
  const legL=makeLeg(-1), legR=makeLeg(1);
  // tronco + colete
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.27,.33,.82,10),vestM); torso.position.y=hipY+.42; g.add(torso);
  const collar=new THREE.Mesh(new THREE.CylinderGeometry(.2,.27,.16,10),vestM); collar.position.y=hipY+.8; g.add(collar);
  const belt=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.12,10),darkM); belt.position.y=hipY+.04; g.add(belt);
  // faixa refletiva no colete
  const strip=new THREE.Mesh(new THREE.CylinderGeometry(.335,.335,.1,10),mat('#dfe7ea',{roughness:.4})); strip.position.y=hipY+.34; g.add(strip);
  // braços — grupos com pivô no ombro
  function makeArm(side){ const ag=new THREE.Group(); ag.position.set(.36*side,hipY+.74,0);
    const up=new THREE.Mesh(new THREE.CylinderGeometry(.09,.08,armLen*.55,7),vestM); up.position.y=-armLen*.27; ag.add(up);
    const fore=new THREE.Mesh(new THREE.CylinderGeometry(.075,.07,armLen*.5,7),skinM); fore.position.y=-armLen*.7; ag.add(fore);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.095,7,6),skinM); hand.position.y=-armLen*.98; ag.add(hand);
    g.add(ag); return ag; }
  const armL=makeArm(-1), armR=makeArm(1);
  // pescoço + cabeça + rosto
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.13,7),skinM); neck.position.y=hipY+.88; g.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.21,12,10),skinM); head.position.y=hipY+1.07; g.add(head);
  const eyeM=mat('#1a1f24');
  [-1,1].forEach(s=>{ const e=new THREE.Mesh(new THREE.SphereGeometry(.028,6,5),eyeM); e.position.set(.07*s,hipY+1.09,.18); g.add(e); });
  // capacete (calota) + aba
  const helm=new THREE.Mesh(new THREE.SphereGeometry(.235,12,9,0,Math.PI*2,0,Math.PI*0.56),helmM); helm.position.y=hipY+1.13; g.add(helm);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.035,14),helmM); brim.position.set(0,hipY+1.08,.07); g.add(brim);
  const crest=new THREE.Mesh(new THREE.BoxGeometry(.06,.18,.34),helmM); crest.position.y=hipY+1.2; g.add(crest);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=false; });
  g.userData={legL,legR,armL,armR,vestM,helmM};
  g.scale.set(1.18,1.18,1.18);
  return g;
}
const SHIRTS={alim:'#e2a13a',agua:'#2f86c4',desp:'#3aa66b',manut:'#c4513a',comp:'#7a5a33',admin:'#6b54a8'};
function buildHumans(){
  for(let i=0;i<22;i++){

    h.userData.job='alim'; h.userData.t=Math.random();
    h.userData.home=new THREE.Vector3(0,0,2);
    h.userData.from=new THREE.Vector3(0,0,2); h.userData.to=new THREE.Vector3(0,0,2);
    h.userData.spd=.18+Math.random()*.12; humans.push(h);
  }

function homeFor(job,k,total){ total=Math.max(1,total);
  const modOf=()=>{ const m=Math.min(21,Math.floor((k+0.5)/total*22)); return modPos(m); };
  if(job==='alim'){ const p=modOf(); return new THREE.Vector3(p.x,0,p.z); }            // entre os tanques
  if(job==='agua'){ const p=modOf(); return new THREE.Vector3(p.x-3,0,p.z+13); }       // no filtro rizosférico
  if(job==='manut'){ const p=modOf(); return new THREE.Vector3(p.x+9,0,p.z+13); }      // nas bombas/biofiltro
  if(job==='desp'){ return new THREE.Vector3(102+(k%3)*5,0,-66+Math.floor(k/3)*6); }   // câmara fria / expedição
  if(job==='comp'){ return new THREE.Vector3(88+(k%3)*5,0,126+Math.floor(k/3)*5); }    // compostagem
  const spots=[[-36,-50],[-26,-50],[-16,-50],[12,-70],[-6,-70],[16,-70],[-50,-50],[-5.5,-50]]; // escritórios
  const s=spots[k%spots.length]; return new THREE.Vector3(s[0],0,s[1]);
}
function localWander(home){ return new THREE.Vector3(home.x+(Math.random()*5-2.5),0,home.z+(Math.random()*5-2.5)); }
function assignHumanJobs(){
  const order=['alim','agua','desp','manut','comp','admin']; let i=0;
  order.forEach(job=>{ const total=G.teams[job];
    for(let k=0;k<total;k++){ const h=humans[i++]; if(!h)return;
      h.userData.job=job;
      h.userData.vestM.color.set(SHIRTS[job]);                   // colete = identidade da equipe
      const home=homeFor(job,k,total); h.userData.home=home;
      h.position.copy(home); h.userData.from=home.clone(); h.userData.to=localWander(home); h.userData.t=Math.random();
    }});
  for(;i<22;i++){ humans[i].visible=false; }
  for(let k=0;k<22;k++){ humans[k].visible = k < coopTotal(); }
}

/* ----------------- CÂMERA ----------------- */
const cam={target:new THREE.Vector3(0,0,IS_MOBILE?40:30),az:-0.5,pol:IS_MOBILE?1.02:0.95,dist:IS_MOBILE?235:200,distTarget:IS_MOBILE?235:200};
const camGoal={target:new THREE.Vector3(0,0,30),az:-0.5,pol:0.95,dist:200,active:false};
function applyCam(){
  cam.dist=Math.max(22,Math.min(380,cam.dist)); cam.pol=Math.max(0.3,Math.min(1.34,cam.pol));
  // limites do terreno (não deixa a câmera fugir para o vazio)
  cam.target.x=Math.max(-150,Math.min(150,cam.target.x));
  cam.target.z=Math.max(-130,Math.min(170,cam.target.z));
  const x=cam.target.x+cam.dist*Math.sin(cam.pol)*Math.sin(cam.az);
  const z=cam.target.z+cam.dist*Math.sin(cam.pol)*Math.cos(cam.az);
  const y=cam.dist*Math.cos(cam.pol);
  camera.position.set(x,y,z); camera.lookAt(cam.target);
}
function zoomBy(f){ camGoal.active=false; cam.distTarget=Math.max(22,Math.min(380,(cam.distTarget||cam.dist)*f)); }
function fitView(){ camGoal.target.set(0,0,40); camGoal.az=-0.5; camGoal.pol=IS_MOBILE?1.0:0.95; camGoal.dist=IS_MOBILE?230:200; camGoal.active=true; cam.distTarget=camGoal.dist; }
window.zoomBy=zoomBy; window.fitView=fitView;
function setupControls(){
  const el=renderer.domElement;
  /* ---------- MOUSE / CANETA (desktop) ---------- */
  let drag=false,rot=false,px=0,py=0,moved=0;
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch')return;
    drag=true;rot=(e.button===2||e.shiftKey);px=e.clientX;py=e.clientY;moved=0;
    camGoal.active=false; try{el.setPointerCapture(e.pointerId);}catch(_){} });
  el.addEventListener('pointermove',e=>{ if(e.pointerType==='touch'||!drag)return;
    const dx=e.clientX-px,dy=e.clientY-py; px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(rot){cam.az-=dx*.005;cam.pol-=dy*.005;}
    else{const s=cam.dist*.0016,ca=Math.cos(cam.az),sa=Math.sin(cam.az);
      cam.target.x-=(dx*ca-dy*sa)*s; cam.target.z-=(dx*sa+dy*ca)*s;} applyCam(); });
  el.addEventListener('pointerup',e=>{ if(e.pointerType==='touch')return; drag=false; if(moved<6) pick(e); });
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('wheel',e=>{e.preventDefault();camGoal.active=false;cam.distTarget=Math.max(22,Math.min(380,(cam.distTarget||cam.dist)*(1+Math.sign(e.deltaY)*.12)));},{passive:false});

  /* ---------- TOQUE (celular/tablet) ---------- */
  let tMode=0, lx=0, ly=0, lDist=0, lAng=0, sX=0, sY=0, tMoved=0;
  const mid=(t)=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const ang=(t)=>Math.atan2(t[1].clientY-t[0].clientY, t[1].clientX-t[0].clientX);
  el.addEventListener('touchstart',e=>{ camGoal.active=false;
    if(e.touches.length===1){ tMode=1; lx=sX=e.touches[0].clientX; ly=sY=e.touches[0].clientY; tMoved=0; }
    else if(e.touches.length>=2){ tMode=2; const t=e.touches; lDist=dist(t); lAng=ang(t); const m=mid(t); lx=m.x; ly=m.y; }
  },{passive:false});
  el.addEventListener('touchmove',e=>{ e.preventDefault();
    if(tMode===1 && e.touches.length===1){ const t=e.touches[0], dx=t.clientX-lx, dy=t.clientY-ly;
      lx=t.clientX; ly=t.clientY; tMoved+=Math.abs(dx)+Math.abs(dy);
      const s=cam.dist*.0019, ca=Math.cos(cam.az), sa=Math.sin(cam.az);
      cam.target.x-=(dx*ca-dy*sa)*s; cam.target.z-=(dx*sa+dy*ca)*s; applyCam();
    } else if(tMode===2 && e.touches.length>=2){ const t=e.touches, d=dist(t), a=ang(t), m=mid(t);
      if(lDist>0){ cam.dist=Math.max(22,Math.min(380, cam.dist*(lDist/d))); cam.distTarget=cam.dist; }  // pinça = zoom
      cam.az -= (a-lAng);                                                     // girar (torção)
      cam.pol -= (m.y-ly)*.004;                                              // inclinar
      const s=cam.dist*.0016, ca=Math.cos(cam.az), sa=Math.sin(cam.az), dcx=m.x-lx;
      cam.target.x-=(dcx*ca)*s; cam.target.z-=(dcx*sa)*s;                     // arrastar com 2 dedos
      lDist=d; lAng=a; lx=m.x; ly=m.y; applyCam();
    }
  },{passive:false});
  el.addEventListener('touchend',e=>{
    if(tMode===1 && tMoved<12 && e.changedTouches.length){ pick({clientX:e.changedTouches[0].clientX, clientY:e.changedTouches[0].clientY}); }
    if(e.touches.length===1){ tMode=1; lx=e.touches[0].clientX; ly=e.touches[0].clientY; tMoved=99; } else tMode=0;
  },{passive:false});
  el.addEventListener('touchcancel',()=>{tMode=0;});

  /* ---------- HOVER (desktop): realce + dica do tanque/prédio ---------- */
  const tip=document.getElementById('tip'); let _hovT=0;
  el.addEventListener('pointermove',e=>{ if(e.pointerType==='touch'||drag||!G.started) { if(drag) hideTip(); return; }
    const now=performance.now(); if(now-_hovT<60) return; _hovT=now; hoverAt(e.clientX,e.clientY); });
  el.addEventListener('pointerleave',hideTip);

  /* ---------- TECLADO ---------- */
  addEventListener('keydown',e=>{
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k=e.key.toLowerCase(),s=6,ca=Math.cos(cam.az),sa=Math.sin(cam.az);
    const modalOpen=document.getElementById('modal').classList.contains('show');
    if(k==='escape'){ e.preventDefault();
      if(modalOpen){ const x=document.querySelector('#modalCard .close-x'); if(x) x.click(); return; }
      if(G.view&&G.view!=='top'){ exitView(); return; }
      if(G.started&&!G.over) openPause(); return; }
    if(!G.started||modalOpen) return;
    camGoal.active=false;
    if(k==='w'||k==='arrowup'){cam.target.x+=sa*s;cam.target.z+=ca*s;} if(k==='s'||k==='arrowdown'){cam.target.x-=sa*s;cam.target.z-=ca*s;}
    if(k==='a'||k==='arrowleft'){cam.target.x-=ca*s;cam.target.z+=sa*s;} if(k==='d'||k==='arrowright'){cam.target.x+=ca*s;cam.target.z-=sa*s;}
    if(k==='q')cam.az-=.08; if(k==='e')cam.az+=.08;
    if(k==='+'||k==='=')zoomBy(0.85); if(k==='-'||k==='_')zoomBy(1.18);
    if(k==='f')fitView(); if(k==='l')toggleLabels(); if(k==='m')toggleMute();
    if(k==='h'||k==='?')openShortcuts();
    if(k>='1'&&k<='9'){ const t=TOOLS[+k-1]; if(t&&t.act){ t.act(); sfx('click'); } }
    if(k===' '||k==='p'){togSpeed();e.preventDefault();} applyCam();});
}
function hideTip(){ const t=document.getElementById('tip'); if(t) t.style.display='none'; if(hoverRing) hoverRing.visible=false;
  if(renderer) renderer.domElement.style.cursor=''; }
function hoverAt(cx,cy){
  const r=renderer.domElement.getBoundingClientRect(), tip=document.getElementById('tip');
  const m=new THREE.Vector2(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  raycaster.setFromCamera(m,camera);
  const hitT=raycaster.intersectObjects([waterInst,wallInst,rimInst],false);
  let html='';
  if(hitT.length && hitT[0].instanceId!=null){ const tk=G.tanks[hitT[0].instanceId], w=tankWorld[tk.id];
    hoverRing.visible=true; hoverRing.position.set(w.x,1.25,w.z);
    const st=tk.state==='vazio'?'Vazio — pronto para povoar':(tk.state==='pronto'?'Pronto para despesca':'Em engorda');
    const col=tk.state==='pronto'?'var(--amber)':(tk.state==='vazio'?'var(--txt-mut)':(tk.wq<35?'var(--coral)':tk.wq<60?'var(--amber)':'var(--mint)'));
    const prog=Math.min(100,Math.round(tk.day/CFG.cycleDays*100));
    html=`<b>Tanque ${tk.id+1}</b> <span class="m">· Módulo ${tk.mod+1}</span><div style="color:${col}">${st}</div>`+
      (tk.state==='vazio'?'':`<div class="m">Ciclo ${prog}% · ${fmtKg(tk.biomass)} · água ${Math.round(tk.wq)}%</div>
       <div class="mini"><i style="width:${prog}%;background:var(--aqua)"></i></div>`);
  } else if(_obraGrp && G.obra && raycaster.intersectObject(_obraGrp,true).some(h=>!h.object.isSprite)){ hoverRing.visible=false;
    html=`<b>Obra da ${OBRA_NOME[G.obra.id]}</b><div class="m">${Math.round(G.obra.prog)}% concluída · ritmo ${ritmoTxt()}</div>
      <div class="mini"><i style="width:${G.obra.prog}%;background:var(--amber)"></i></div><div class="m">Acompanhada pelo GAO — veja o Mural (9)</div>`;
  } else { hoverRing.visible=false;
    const hits=raycaster.intersectObjects(Object.values(buildings).map(b=>b.group).filter(Boolean),true);
    for(const h of hits){ if(h.object.isSprite) continue; let o=h.object, found=null; while(o){ if(o.userData&&o.userData.enter){found=o.userData.enter;break;} o=o.parent; }
      if(found){ const N={main:'Administração & Galpão de ração',cold:'Câmara fria / Expedição',ubp:'UBP — Beneficiamento',upp:'UPP — Processamento (CMS)'};
        html=`<b>${N[found]||'Estrutura'}</b><div class="m">Clique para entrar</div>`; } break; }
  }
  if(html){ tip.innerHTML=html; tip.style.display='block';
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    tip.style.left=Math.min(innerWidth-tw-8,cx+16)+'px'; tip.style.top=Math.min(innerHeight-th-8,cy+14)+'px';
    renderer.domElement.style.cursor='pointer'; }
  else hideTip();
}

function enterView(which){
  const b=buildings[which]; if(!b)return; G.view=which;
  if(b.roof) b.roof.visible=false;
  // mostra placas internas
  b.group.traverse(o=>{ if(o.userData&&o.userData.interiorLabel) o.visible=true; });
  camGoal.target.copy(b.center); camGoal.az=-0.5; camGoal.pol=0.62; camGoal.dist=(which==='cold'?40:64); camGoal.active=true;
  document.getElementById('exitView').classList.add('show');
  toast('info', which==='cold'?'Câmara fria / Expedição':'Administração & Galpão',
    'Você entrou na estrutura. Use “Voltar” ou Esc para sair.');
}
function exitView(){
  Object.values(buildings).forEach(b=>{ if(b.roof) b.roof.visible=true;
    if(b.group) b.group.traverse(o=>{ if(o.userData&&o.userData.interiorLabel) o.visible=false; }); });
  G.view='top'; camGoal.target.set(0,0,30); camGoal.az=-0.5; camGoal.pol=0.95; camGoal.dist=200; camGoal.active=true;
  document.getElementById('exitView').classList.remove('show');
}

/* ----------------- SELEÇÃO ----------------- */
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(m,camera);
  // tanques (instanced)
  const hitT=raycaster.intersectObjects([waterInst,wallInst,rimInst],false);
  if(hitT.length && hitT[0].instanceId!=null){ onTankClick(G.tanks[hitT[0].instanceId]); return; }
  // estruturas
  const hits=raycaster.intersectObjects(scene.children,true);
  for(const h of hits){ let o=h.object; while(o){ if(o.userData&&o.userData.enter){ enterView(o.userData.enter); return;} o=o.parent; } }
  G.selected=null; document.getElementById('inspect').classList.remove('show'); if(selRing)selRing.visible=false;
}
function onTankClick(tk){
  if(G.tool==='povoar') povoar(tk);
  else if(G.tool==='colher') colher(tk);
  else if(G.tool==='manut') manutencao(tk);
  G.selected=tk; renderInspect();
  if(selRing){ selRing.visible=true; const w=tankWorld[tk.id]; selRing.position.set(w.x,1.3,w.z); }
  sfx('click');
  // foca a câmera no tanque suavemente
  camGoal.target.set(tankWorld[tk.id].x,0,tankWorld[tk.id].z); camGoal.az=cam.az; camGoal.pol=cam.pol;
  camGoal.dist=Math.min(cam.dist,70); camGoal.active=true;
}

function teamEff(){
  const T=G.teams, active=G.tanks.filter(t=>t.state!=='vazio').length;
  const morale=(G._moraleDays>0)?1.12:1;
  return {
    feedCap: T.alim*CFG.tanksPerFeeder,
    feedEff: Math.min(1, morale*(T.alim*CFG.tanksPerFeeder)/Math.max(active,1)),
    waterBonus: Math.min(1, morale*(T.agua*CFG.tanksPerWater)/Math.max(active,1)), // 0..1 recuperação RAS
    harvestPerDay: Math.max(1, T.desp*CFG.harvestPerCrew),
    sellMul: 1 + Math.min(.06, T.desp*0.012),       // menos perdas/expedição melhor
    resil: Math.min(.85, T.manut*0.16),             // reduz mortalidade de eventos
    compIncome: T.comp*450,                          // R$/dia de adubo
    priceMul: 1 + Math.min(.15, T.admin*0.05) + consBonus(),   // comercialização + gestão do CAE
    overheadMul: Math.max(.7, 1 - T.admin*0.06),     // admin enxuga overhead
  };
}

function povoarTodos(){ const v=G.tanks.filter(t=>t.state==='vazio'); let n=0;

function colher(tk){ if(tk.state==='vazio'){toast('warn','Vazio','Nada para colher.');return;}
  const E=teamEff(); const liq=tk.biomass*CFG.pricePerKg*G.priceMul*E.priceMul*E.sellMul*chainMul()*(1-CFG.taxRate);

function colherProntos(quiet){ const E=teamEff(); const pr=G.tanks.filter(t=>t.state==='pronto').slice(0,E.harvestPerDay*30);
  let tot=0,n=0; pr.forEach(t=>{ const liq=t.biomass*CFG.pricePerKg*G.priceMul*E.priceMul*E.sellMul*chainMul()*(1-CFG.taxRate);

  if(n&&!quiet)sfx('coin');
  toast(n?'good':'warn',quiet?'Despesca automática':'Despesca em lote',n?`${n} tanque(s) · ${money(tot)}.`:'Nenhum tanque pronto.',quiet);
  refreshTanks(); updateHUD(); if(G.selected)renderInspect(); checkWin(); }

  G.cash-=c; tk.wq=Math.min(100,tk.wq+45); tk.disease=Math.max(0,tk.disease-50);
  toast('info','Manutenção RAS',`Decantador e filtro limpos no T${tk.id+1}.`); refreshTanks(); updateHUD(); if(G.selected)renderInspect(); }
function comprarRacao(ton){ const kg=ton*1000, esp=CFG.feedMax-G.feed, real=Math.min(kg,esp);

function doBuild(id){ const b=BUILDS.find(x=>x.id===id); if(!b)return;
  if(id==='ubp'||id==='upp'){                     // empreendimentos: eleição do GAO + obra acompanhada
    if(G.obra){ toast('warn','Obra em andamento','Conclua a obra atual antes de iniciar outra.'); return; }
    if(G.cash<b.cost){toast('bad','Sem caixa','Falta dinheiro para a contrapartida.');return;}
    if(!G.gao){ openGaoElection(id); return; }
    startObra(id); return; }
  if(G.cash<b.cost){toast('bad','Sem caixa','');return;} G.cash-=b.cost; b.apply();
  toast('good','Investimento concluído',`${b.emoji} ${b.name}.`); updateHUD(); openBuild(); }

let acc=0; let _lblNear=true;
function tickDay(){
  G.day++;
  autoRotina();                                   // Modo decisões: a equipe cuida da rotina
  const E=teamEff();
  const active=G.tanks.filter(t=>t.state!=='vazio');
  let feedNeed=0; active.forEach(t=>feedNeed+=feedFor(t));
  const load=active.length*CFG.energyPerTank, cap=CFG.energyCap+(G.hasSolar?12:0);
  const energyOK = G.outage>0 ? G.hasGen : load<=cap;
  const avail=Math.min(G.feed,feedNeed), fed=feedNeed>0?avail/feedNeed:1; G.feed=Math.max(0,G.feed-avail);

  active.forEach(t=>{ t.day++;
    t._hungry = fed<0.85;
    const dens=t.biomass/CFG.harvestKg;
    let wd=-2-dens*6;
    if(energyOK) wd+=4+5*E.waterBonus;            // RAS + equipe de água
    if(G.hasNet) wd+=.6; if(!energyOK) wd-=10;
    t.wq=Math.max(0,Math.min(100,t.wq+wd));
    if(t.wq<45) t.disease=Math.min(100,t.disease+(45-t.wq)*0.25); else t.disease=Math.max(0,t.disease-2-E.resil*3);
    let mort=.0005;
    if(fed<.85) mort+=(.85-fed)*.02;
    if(t.wq<40) mort+=(40-t.wq)*.0009;
    if(!energyOK) mort+=.012*(1-E.resil);
    mort+=t.disease*.00025*(1-E.resil);
    if(G.hasNet) mort*=.7;
    t.fish=Math.max(0,t.fish*(1-mort));
    const gq=Math.min(fed*E.feedEff+0.001, t.wq/70, 1);
    const tpf=CFG.harvestKg/CFG.alevinosPerTank;
    const prog=Math.min(1,t.day/CFG.cycleDays), sig=1/(1+Math.exp(-8*(prog-.5)));
    const ideal=t.fish*tpf*sig; t.biomass+=(ideal-t.biomass)*.06*Math.max(.15,gq);
    if(t.day>=CFG.cycleDays&&t.state==='engorda'){t.state='pronto';
      toast('info','Tanque pronto',`T${t.id+1} no ponto de abate (${fmtKg(t.biomass)}).`,true);}
    if(t.fish<50&&t.state!=='vazio'){t.state='vazio';t.biomass=0;t.fish=0; toast('bad','Perda total',`T${t.id+1} perdido.`);}
  });

  if(active.length&&G.feed<feedNeed*3) toastEvery('racao',8,'warn','Ração baixa','Estoque para menos de 3 dias — compre em Alimentar (tecla 2).');
  if(active.length&&E.feedEff<0.85) toastEvery('fome',10,'warn','Peixes com fome','Faltam tratadores — reforce a equipe de Alimentação (tecla 4).');
  const nProntos=readyCount();                    // aviso chamativo de despesca (faixa + alerta central)
  if(nProntos>(G._prontosPrev||0) && !G.modoDecisoes) announceReady(nProntos,nProntos-(G._prontosPrev||0));

  // ECONOMIA
  const kwh=(G.outage>0&&!G.hasGen?0:load)*24;
  let energy=kwh*CFG.energyTariff*(G.hasSolar?0.6:1); if(G.outage>0&&G.hasGen) energy*=1.6;
  const retiradas=(coopTotal()*CFG.coopRetirada/30)*E.overheadMul;
  const upkeep=active.length*6;
  const compRev=E.compIncome*(active.length>0?1:0);
  const conselhos=Object.values(G.conselhos||{}).reduce((s,c)=>s+c.cae*c.pro,0)/30;   // pró-labore do CAE (Art. 24, IV)
  const daily=energy+retiradas+upkeep+conselhos-compRev;
  G.cash-=daily; G.profitAcc-=daily;

  if(G.priceTimer>0){G.priceTimer--; if(!G.priceTimer)G.priceMul=1;}
  if(G.outage>0){G.outage--; if(!G.outage)toast('good','Energia restabelecida','RAS normalizado.');}
  if(G._moraleDays>0)G._moraleDays--;
  tickCommerce(); updateIndicators();
  if(G.day%15===0) maybeEvent(E);
  if(G.day>0 && G.day%30===0) doMonthEnd();
  tickGovernanca();                               // obra + reuniões do GAO + demandas do dia + chuva

  refreshTanks(); updateHUD(); updateAlerts(); if(G.selected)renderInspect();
  if(G.cash<CFG.ruinCash&&!G.over) endGame(false);
}
function feedFor(t){ const p=Math.min(1,t.day/CFG.cycleDays); return CFG.feedBase+(CFG.feedMax2-CFG.feedBase)*p; }
function maybeEvent(E){ const active=G.tanks.filter(t=>t.state!=='vazio').length; if(!active)return;
  const r=Math.random();
  if(r<.22){ G.outage=2+(Math.random()*3|0);
    toast(G.hasGen?'warn':'bad',G.hasGen?'Queda de energia':'⚠ Queda de energia!',
      G.hasGen?'Gerador acionado (diesel caro).':'Sem gerador — bombas do RAS pararam, oxigênio caindo!');
    pushNews(`⚡ Falha no fornecimento de energia atinge a zona rural de ${cid()}.`,'bad'); }
  else if(r<.42){ G.priceMul=1.18+Math.random()*.22; G.priceTimer=12;
    toast('good','Alta no preço',`Atacado regional (CEASA) +${Math.round((G.priceMul-1)*100)}%.`);
    pushNews(`📈 Tilápia dispara +${Math.round((G.priceMul-1)*100)}% no atacado regional (CEASA).`,'good'); }
  else if(r<.55){ G.priceMul=0.78+Math.random()*.12; G.priceTimer=10;
    toast('warn','Preço em baixa',`Excesso de oferta derruba o preço.`);
    pushNews('📉 Safra cheia derruba o preço da tilápia na região.','warn'); }
  else if(r<.66){ if(G.wells<3){ toast('warn','Restrição hídrica','Estiagem. Considere outro poço artesiano.');
    pushNews('🌵 Estiagem na região pressiona o uso da água.','warn'); } }
  else if(r<.8){ const m=Math.random()*22|0; G.tanks.filter(t=>t.mod===m&&t.state==='engorda').forEach(t=>t.disease=Math.min(100,t.disease+40*(1-E.resil)));
    toast('bad','Surto sanitário',`Doença no Módulo ${m+1}. ${G.teams.manut?'Manutenção contém parte do dano.':'Sem manutenção — risco alto.'}`);
    pushNews(`🦠 Alerta sanitário: surto afeta o Módulo ${m+1} da UPA.`,'bad'); }
  else if(r<.9){ toast('info','Auditoria Petrobras/IBAMA','Vistoria do licenciamento — boas práticas em dia melhoram a imagem.');
    pushNews('🏛️ Petrobras vistoria o PEA Pescarte e cobra indicadores socioambientais.','info'); }
  else { toast('good','Assistência técnica','Visita do PEA Pescarte elevou as boas práticas de manejo.');
    G.tanks.filter(t=>t.state==='engorda').forEach(t=>t.disease=Math.max(0,t.disease-15));
    pushNews('🤝 Extensão rural do PEA Pescarte capacita cooperados em manejo.','good'); }
}

function stars(n){ n=Math.max(1,Math.min(5,Math.round(n))); return '★'.repeat(n)+'☆'.repeat(5-n); }
let _monthlyPending=false;
function doMonthEnd(){ if(G.over)return; if(_decisionOpen){ if(G.day>=360) setTimeout(()=>{ if(!G.over&&!_decisionOpen) doMonthEnd(); },500); return; }
  _monthlyPending=true;
  if(!triggerDecision()){ _monthlyPending=false; _prevSpeed=G.speed||1; setSpeed(0); _decisionOpen=true; showBalance(); }
}
function showBalance(){
  const mes=Math.floor(G.day/30), snap=G.monthSnap||{cash:CFG.startCash,prod:0};
  const lucro=G.cash-snap.cash, prod=G.producedKg-(snap.prod||0);
  G.monthSnap={cash:G.cash,prod:G.producedKg};
  G.history.push({m:mes, lucro, cash:G.cash, prod:Math.max(0,prod)});
  const H=G.history.slice(-12), labels=H.map(h=>'M'+h.m);
  const bar=(v)=>{ const c=v<35?'var(--coral)':v<60?'var(--amber)':'var(--mint)'; return `<div class="mini"><i style="width:${Math.round(v)}%;background:${c}"></i></div>`; };
  const ir=(ic,k,v,pct)=>`<div class="irow"><span>${icon(ic)} ${k}</span>${bar(pct)}<b>${v}</b></div>`;
  openModal(`<div style="text-align:center;font:700 11px 'JetBrains Mono',monospace;letter-spacing:2px;color:var(--txt-mut);text-transform:uppercase">Mês ${mes} de 12 · ${MES[(mes-1)%12]}/${2027+Math.floor((mes-1)/12)}</div>
   <h2 style="text-align:center">Balanço do <span>mês</span></h2>
   <p class="lead" style="text-align:center;margin-bottom:8px">Resultado da gestão neste mês — já incluindo a sua decisão.</p>
   <div class="kpis">
     <div class="kpi"><div class="k">Resultado do mês</div><div class="v" style="color:${lucro>=0?'var(--mint)':'var(--coral)'}">${lucro>=0?'+':''}${money(lucro)}</div><div class="d">variação do caixa</div></div>
     <div class="kpi"><div class="k">Caixa</div><div class="v" style="color:${G.cash<0?'var(--coral)':'var(--txt)'}">${money(G.cash)}</div><div class="d">acumulado ${money(G.profitAcc)}</div></div>
     <div class="kpi"><div class="k">Vendido no mês</div><div class="v">${fmtKg(Math.max(0,prod))}</div><div class="d">total ${fmtKg(G.producedKg)}</div></div>
   </div>
   ${H.length>1?`<div class="chart"><div class="ct"><span>Resultado mensal</span><span>R$</span></div>${barChart(H.map(h=>h.lucro),labels)}</div>`:''}
   ${ir('drop','Qualidade da água',waterIndex()+'%',waterIndex())}
   ${ir('sack','Estoque de ração',fmtKg(G.feed),G.feed/CFG.feedMax*100)}
   ${ir('users','Organização',orgIndex()+'%',orgIndex())}
   ${ir('leaf','Sustentabilidade',Math.round(G.sustentabilidade)+'%',G.sustentabilidade)}
   ${ir('star','Confiança',Math.round(G.confianca)+'%',G.confianca)}
   <div class="row"><span>${icon('link')} Cadeia de valor</span><b>×${chainMul().toFixed(2)} · ${chainLabel()}</b></div>
   <div class="row"><span>${icon('vote')} Governança</span><b>${G._ataSeq||0} atas · ${G.devolutivas} devolutiva${G.devolutivas===1?'':'s'}${G.obra?' · obra '+Math.round(G.obra.prog)+'%':''}</b></div>
   <button class="btn primary" style="justify-content:center;margin-top:12px" onclick="closeBalance()">Continuar ›</button>`);
}

function finalReport(){ if(G.over)return; G.over=true; setSpeed(0);
  const prodStar = G.producedKg>=160000?5:G.producedKg>=110000?4:G.producedKg>=70000?3:G.producedKg>=35000?2:1;
  const finStar  = G.profitAcc>=1200000?5:G.profitAcc>=700000?4:G.profitAcc>=250000?3:G.profitAcc>=0?2:1;
  const orgStar  = Math.round(orgIndex()/20);
  const sustStar = Math.round(G.sustentabilidade/20);
  const confStar = Math.round(G.confianca/20);
  const chainStar= G.hasUPP?5:(G.hasUBP?3:1);
  const gaoStar = Math.max(1,Math.min(5, 1 + (G.gao?1:0) + Math.min(2,Math.floor(G.devolutivas/2)) + ((G._ataSeq||0)>=10?1:0) - Math.min(2,G._gaoInfra)));
  const media=(prodStar+finStar+orgStar+sustStar+confStar+chainStar+gaoStar)/7, pct=media*20;
  const grade = media>=4.5?'Gestão exemplar':media>=3.5?'Boa gestão':media>=2.5?'Gestão em construção':'Gestão com dificuldades';
  const linha=(ic,k,n)=>`<div class="row"><span>${icon(ic)} ${k}</span><b style="color:var(--amber);letter-spacing:2px">${stars(n)}</b></div>`;
  const H=G.history||[];

/* =====================================================================
   MOTOR DE DECISÕES (mês · demanda do dia · reunião do GAO)
   ===================================================================== */
let _decisionOpen=false, _prevSpeed=1, _curDec=null, _curKind='mes', _votes=[];
function decisionPool(kind){
  const ok=d=>{ try{ return d.cond(); }catch(e){ return false; } };
  // o GAO atua até a inauguração (Art. 16); depois seguem devolutivas, atas e o controle social do CAE/CFE
  let list = kind==='demanda' ? DEMANDAS : kind==='gao' ? GAO_DECISIONS : DECISIONS.concat(GAO_DECISIONS.filter(d=>G.obra||d.pos));
  let pool=list.filter(ok);
  const recent=G._recentDec||[]; const fresh=pool.filter(d=>!recent.includes(d.titulo));
  return fresh.length?fresh:pool;
}
function triggerDecision(kind){ kind=kind||'mes'; if(_decisionOpen||G.over)return false;
  const pool=decisionPool(kind); if(!pool.length)return false;
  const d=pool[Math.random()*pool.length|0]; _curDec=d; _curKind=kind;
  G._recentDec=[d.titulo].concat(G._recentDec||[]).slice(0,6);
  _prevSpeed=G.speed||1; setSpeed(0); _decisionOpen=true;
  const lbl=kind==='demanda'?'Demanda do dia':kind==='gao'?'Reunião do GAO':'Situação do mês';
  pushNews(`${d.emoji} ${lbl}: ${d.titulo}.`,'info'); sfx('pop');
  try{ if(d.onShow) d.onShow(); }catch(e){}
  if(G.oficina) openOficinaGate(d); else openDecisionOptions(d);
  return true;
}
function evtHead(d){
  const kind=_curKind==='demanda'?'Demanda do dia':_curKind==='gao'?'Reunião do GAO':'Decisão do mês';
  return `<div style="text-align:center;font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:2px;color:var(--aqua);text-transform:uppercase;margin-bottom:6px">${kind}${d.art?` · Estatuto ${d.art}`:''}</div>
  <div style="text-align:center;margin-bottom:4px">
   <div style="display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--ink2);border:1px solid var(--line);align-items:center;justify-content:center;font-size:29px">${d.emoji}</div></div>
  <h2 style="text-align:center;line-height:1.18">${d.titulo}</h2>
  <p class="lead" style="text-align:center;margin-bottom:8px">${d.texto}</p>
  <div style="text-align:center;color:var(--txt-mut);font-size:12px;margin-bottom:13px">🕊️ Sem pressa — o tempo está pausado enquanto vocês decidem.</div>`; }
function openOficinaGate(d){ openModal(`${evtHead(d)}
   <div style="background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px">
     🗣️ <b>Modo oficina</b><br><span style="color:var(--txt-dim);font-size:13px">Conversem em grupo. Depois, a assembleia vota: vence a opção com maioria simples (50% + 1 dos presentes).</span></div>
   <button class="btn primary" style="justify-content:center" onclick="showOptions()">Ver as opções e votar</button>`); }
window.showOptions=()=>{ openDecisionOptions(_curDec); };
function availableOps(d){ return d.ops.map((o,i)=>({o,i})).filter(x=>{ try{ return !x.o.cond || x.o.cond(); }catch(e){ return true; } }); }
function openDecisionOptions(d){
  const ops=availableOps(d);
  if(G.oficina){ _votes=d.ops.map(()=>0); renderVoting(); return; }
  openModal(`${evtHead(d)}
   ${ops.map(({o,i},k)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px;height:auto;padding:11px"
      onclick="decide(${i})">
      <div style="font-weight:700">${String.fromCharCode(65+k)}) ${o.lb}</div>
      <div style="font-size:11px;color:var(--txt-mut);font-weight:400;margin-top:2px">${o.tag}</div></button>`).join('')}`);
}
/* votação da assembleia (Art. 31, VI: maioria simples dos presentes) */
function voteWinner(){ const tot=_votes.reduce((a,b)=>a+b,0); if(!tot) return -1;
  const mx=Math.max(..._votes), i=_votes.indexOf(mx); return mx>tot/2 ? i : -1; }
function renderVoting(){ const d=_curDec, ops=availableOps(d), tot=_votes.reduce((a,b)=>a+b,0), w=voteWinner();
  const need=Math.floor(tot/2)+1;
  openModal(`${evtHead(d)}
   <div class="votebox">
     ${ops.map(({o,i},k)=>`<div class="vrow ${w===i?'win':''}">
        <div class="vtxt"><b>${String.fromCharCode(65+k)}) ${o.lb}</b><small>${o.tag}</small></div>
        <div class="stepper"><button onclick="voteAdj(${i},-1)" aria-label="Menos um voto">−</button><div class="n">${_votes[i]}</div><button onclick="voteAdj(${i},1)" aria-label="Mais um voto">+</button></div>
      </div>`).join('')}
     <div class="vfoot">${tot?`<span>Votos: <b>${tot}</b> · maioria simples: <b>${need}</b></span>`:'<span>Registrem os votos da assembleia (mãos levantadas).</span>'}
       <span class="${w>=0?'ok':'no'}">${tot?(w>=0?'✔ Há maioria':'✖ Sem maioria — conversem e votem de novo'):''}</span></div>
     <div class="vart">Estatuto, Art. 31, VI: “as deliberações serão tomadas pelos presentes, sendo necessário o voto da maioria simples de 50% + 1”.</div>
   </div>
   <button class="btn primary" style="justify-content:center;margin-top:10px" ${w>=0?'':'disabled'} onclick="registrarVotacao()">Registrar a decisão da assembleia</button>
   <div style="text-align:center;margin-top:9px"><span onclick="skipVoting()" style="cursor:pointer;color:var(--txt-mut);font-size:12px;text-decoration:underline">Decidir sem votação</span></div>`);
}
window.voteAdj=(i,dv)=>{ _votes[i]=Math.max(0,_votes[i]+dv); renderVoting(); };
window.registrarVotacao=()=>{ const w=voteWinner(); if(w<0) return; decide(w,_votes.slice()); };
window.skipVoting=()=>{ const d=_curDec; const ops=availableOps(d);
  openModal(`${evtHead(d)}
   ${ops.map(({o,i},k)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px;height:auto;padding:11px" onclick="decide(${i})">
      <div style="font-weight:700">${String.fromCharCode(65+k)}) ${o.lb}</div>
      <div style="font-size:11px;color:var(--txt-mut);font-weight:400;margin-top:2px">${o.tag}</div></button>`).join('')}`); };
window.decide=(oi,votes)=>{ const d=_curDec; let res='';
  if(!d||!d.ops[oi]) return;
  try{ res=d.ops[oi].fn()||''; }catch(e){ console.error(e); }
  registrarAta(d,d.ops[oi],votes);
  refreshTanks(); updateHUD(); updateReadyUI(); if(G.selected)renderInspect();
  openConsequence(d,d.ops[oi],res,votes); };
function openConsequence(d,o,res,votes){
  const refl = G.oficina? `<div style="background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px">
     <b style="font-size:13px">🗣️ Para refletir na oficina</b>
     <ul style="margin:6px 0 0 16px;font-size:12.5px;color:var(--txt-dim);line-height:1.5">${REFLEXAO.map(r=>`<li>${r}</li>`).join('')}</ul></div>`:'';
  const tot=votes?votes.reduce((a,b)=>a+b,0):0;
  openModal(`<h2 style="text-align:center">O que aconteceu?</h2>
   <div class="build-item" style="align-items:flex-start"><div class="bi-ico">${d.emoji}</div>
     <div class="bi-txt"><b style="font-weight:700">${o?o.lb:''}</b><p style="font-size:13px;color:var(--txt);margin-top:4px">${res}</p></div></div>
   <div style="font-size:11.5px;color:var(--txt-mut);text-align:center;margin-top:2px">📜 Ata nº ${G._ataSeq} registrada no mural de transparência${tot?` · ${G.atas[G.atas.length-1].favor} de ${tot} votos`:''}.</div>
   ${refl}
   <button class="btn primary" style="justify-content:center;margin-top:12px" onclick="finishDecision()">Continuar</button>`);
}
window.finishDecision=()=>{ closeModal();
  if(_monthlyPending){ _monthlyPending=false; showBalance(); return; }   // mês: mostra o balanço após a decisão
  _decisionOpen=false; setSpeed(_prevSpeed||1);
  refreshTanks(); updateHUD(); if(G.selected)renderInspect(); if(G.cash<CFG.ruinCash&&!G.over)endGame(false); };

const alertPools={pronto:[],fome:[],agua:[]};
function ensureAlertPools(){ if(alertPools.pronto.length)return;
  const mk=(emoji,bg)=>{ const a=[]; for(let i=0;i<7;i++){ const s=makeLabel(emoji,4.2,'#ffffff',bg); s.visible=false; s.renderOrder=1000; scene.add(s); a.push(s);} return a; };
  alertPools.pronto=mk('🪣','rgba(18,80,60,.9)'); alertPools.fome=mk('🍚','rgba(110,80,25,.9)'); alertPools.agua=mk('💧','rgba(110,42,37,.9)'); }
function assignAlerts(list,pool){ pool.forEach((s,i)=>{ const t=list[i];
  if(t){ s.position.set(tankWorld[t.id].x,4.4,tankWorld[t.id].z); s.visible=true; } else s.visible=false; }); }
function updateAlerts(){ ensureAlertPools();
  const pronto=[],fome=[],agua=[];
  G.tanks.forEach(t=>{ if(t.state==='vazio')return;
    if(t.state==='pronto') pronto.push(t);
    else { if(t._hungry) fome.push(t); if(t.wq<45) agua.push(t); } });
  agua.sort((a,b)=>a.wq-b.wq);
  assignAlerts(pronto,alertPools.pronto); assignAlerts(fome,alertPools.fome); assignAlerts(agua,alertPools.agua);
}

function endGame(win){ G.over=true; setSpeed(0);
  openModal(`<div style="text-align:center"><div style="font-size:44px">${win?'🏆':'📉'}</div>
    <h2>${win?'Aporte <span>quitado!</span>':'A UPA <span style="color:var(--coral)">faliu</span>'}</h2>

      :`O caixa chegou a ${money(G.cash)}. Reveja a alocação das equipes, ração e energia, e tente de novo.`}</p>

    <button class="btn primary" style="flex:2;justify-content:center" onclick="playAgain()">Tentar de novo</button></div></div>`);
  lsDel(SAVE_KEY); sfx('bad'); }

/* ===================== FX: cardumes · bolhas · splash · ondulação ===================== */
const _fo=new THREE.Object3D();
function buildFX(){
  FISH_CAP=IS_MOBILE?80:240; BUB_CAP=IS_MOBILE?50:140; SPL_CAP=IS_MOBILE?40:56;
  // peixes (cardume) — cone baixo apontando para frente (+Z)
  const fishG=new THREE.ConeGeometry(0.22,0.8,5); fishG.rotateX(Math.PI/2);
  fishInst=new THREE.InstancedMesh(fishG, mat('#8fa6a0',{roughness:.5,metalness:.1,emissive:'#19332e',emissiveIntensity:.15}), FISH_CAP);
  fishInst.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(FISH_CAP*3),3);
  fishInst.frustumCulled=false; fishInst.count=0;
  const fc=new THREE.Color(), cols=['#8fa6a0','#9db0a6','#7d9488','#aeb8a0'];
  for(let i=0;i<FISH_CAP;i++)fishInst.setColorAt(i,fc.set(cols[i%cols.length]));
  // bolhas de aeração
  const bubG=new THREE.SphereGeometry(0.13,6,5);
  bubbleInst=new THREE.InstancedMesh(bubG, new THREE.MeshStandardMaterial({color:'#eafcff',roughness:.2,transparent:true,opacity:.5,depthWrite:false}), BUB_CAP);
  bubbleInst.frustumCulled=false; bubbleInst.count=0;
  for(let i=0;i<BUB_CAP;i++)bubbleData.push({id:-1,ox:0,oz:0,y:0,sp:.5});
  // gotas de splash (despesca)
  const splG=new THREE.SphereGeometry(0.12,5,4);
  splashInst=new THREE.InstancedMesh(splG, new THREE.MeshStandardMaterial({color:'#dff4f8',roughness:.25}), SPL_CAP);
  splashInst.frustumCulled=false;
  for(let i=0;i<SPL_CAP;i++){ splashData.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0});
    _fo.position.set(0,-999,0); _fo.scale.setScalar(.001); _fo.updateMatrix(); splashInst.setMatrixAt(i,_fo.matrix); }
  splashInst.instanceMatrix.needsUpdate=true;
  scene.add(fishInst,bubbleInst,splashInst);
  assignFish();
}
function assignFish(){
  activeList = G.tanks.filter(t=>t.state!=='vazio').map(t=>t.id);
  fishData.length=0;
  if(activeList.length){
    for(const id of activeList){ const tk=G.tanks[id]; const n=2+Math.min(6,Math.floor(tk.biomass/520));
      for(let k=0;k<n && fishData.length<FISH_CAP;k++)
        fishData.push({id, r:TANK_R*(.25+Math.random()*.5), a:Math.random()*6.28,
          s:(.45+Math.random()*.7)*(Math.random()<.5?1:-1), y:Math.random()*6.28, ws:1+Math.random()*1.6});
      if(fishData.length>=FISH_CAP)break; }
  }
  if(fishInst)fishInst.count=fishData.length;
}
function rippleWater(t){ if(!waterGeo||!waterBase)return; const p=waterGeo.attributes.position, a=p.array;
  for(let i=0;i<a.length;i+=3){ const x=waterBase[i], y=waterBase[i+1], d=Math.hypot(x,y);
    a[i+2]=waterBase[i+2]+Math.sin(d*1.5-t*2.1)*0.06 + Math.cos(x*0.9+t*1.3)*0.02; }
  p.needsUpdate=true;
}
function splash(x,z){ if(!splashInst)return; let n=0;
  for(let i=0;i<splashData.length && n<16;i++){ const d=splashData[i]; if(d.on)continue;
    const ang=Math.random()*6.28, sp=1.4+Math.random()*2.4;
    d.on=true; d.x=x; d.z=z; d.y=1.15; d.vx=Math.cos(ang)*sp*0.55; d.vz=Math.sin(ang)*sp*0.55;
    d.vy=2.6+Math.random()*2.6; d.life=0.55+Math.random()*0.4; n++; }
}
function updateFX(dt,t,moving){
  // peixes nadando em círculo, logo abaixo da lâmina
  if(fishInst && fishData.length){
    for(let i=0;i<fishData.length;i++){ const f=fishData[i], c=tankWorld[f.id]; if(!c)continue;
      f.a+=f.s*dt*moving*0.7;
      const x=c.x+Math.cos(f.a)*f.r, z=c.z+Math.sin(f.a)*f.r, y=0.78+Math.sin(t*f.ws+f.y)*0.06;
      const la=f.a+0.12*Math.sign(f.s), ax=c.x+Math.cos(la)*f.r, az=c.z+Math.sin(la)*f.r;
      _fo.position.set(x,y,z); _fo.lookAt(ax,y,az); _fo.scale.set(1,1,1); _fo.updateMatrix();
      fishInst.setMatrixAt(i,_fo.matrix); }
    fishInst.instanceMatrix.needsUpdate=true;
  }
  // bolhas de aeração subindo nos tanques ativos
  if(bubbleInst){
    if(!activeList.length){ bubbleInst.count=0; }
    else { bubbleInst.count=bubbleData.length;
      for(let i=0;i<bubbleData.length;i++){ const b=bubbleData[i];
        if(b.id<0||tankWorld[b.id]===undefined){ b.id=activeList[(Math.random()*activeList.length)|0]; b.ox=(Math.random()*2-1)*TANK_R*.6; b.oz=(Math.random()*2-1)*TANK_R*.6; b.y=0.5+Math.random()*0.5; b.sp=.5+Math.random()*.6; }
        b.y+=b.sp*dt*(0.5+moving*0.5);
        if(b.y>1.16){ b.y=0.45+Math.random()*0.2; b.id=activeList[(Math.random()*activeList.length)|0]; b.ox=(Math.random()*2-1)*TANK_R*.6; b.oz=(Math.random()*2-1)*TANK_R*.6; b.sp=.5+Math.random()*.6; }
        const c=tankWorld[b.id]||{x:0,z:0};
        _fo.position.set(c.x+b.ox,b.y,c.z+b.oz); _fo.rotation.set(0,0,0); _fo.scale.setScalar(0.5+(1.16-b.y)*0.35); _fo.updateMatrix();
        bubbleInst.setMatrixAt(i,_fo.matrix); }
      bubbleInst.instanceMatrix.needsUpdate=true;
    }
  }
  // splash da despesca
  if(splashInst){
    for(let i=0;i<splashData.length;i++){ const d=splashData[i];
      if(d.on){ d.life-=dt; d.vy-=9.8*dt; d.x+=d.vx*dt; d.z+=d.vz*dt; d.y+=d.vy*dt;
        if(d.y<1.0||d.life<=0){ d.on=false; _fo.position.set(0,-999,0); _fo.scale.setScalar(.001); }
        else { _fo.position.set(d.x,d.y,d.z); _fo.scale.setScalar(Math.max(.2,d.life)); } }
      else { _fo.position.set(0,-999,0); _fo.scale.setScalar(.001); }
      _fo.rotation.set(0,0,0); _fo.updateMatrix(); splashInst.setMatrixAt(i,_fo.matrix); }
    splashInst.instanceMatrix.needsUpdate=true;
  }
}
