let _actx=null, _muted=!PREFS.sfx, _master=null, _amb=null;
function audioOn(){ try{ if(!_actx){ _actx=new (window.AudioContext||window.webkitAudioContext)();
      _master=_actx.createGain(); _master.gain.value=PREFS.volume; _master.connect(_actx.destination); }
    if(_actx.state==='suspended')_actx.resume(); updateAmbient(); }catch(e){} }
function sfx(type){ if(_muted||!_actx) return; try{
  const o=_actx.createOscillator(), g=_actx.createGain(), now=_actx.currentTime;
  const P={click:[440,0.05,'square',0.03], coin:[880,0.12,'sine',0.11], good:[660,0.18,'triangle',0.12],
    warn:[420,0.13,'sine',0.07], bad:[240,0.2,'triangle',0.09], pop:[520,0.07,'sine',0.06]}[type]||[440,0.05,'sine',0.05];
  o.type=P[2]; o.frequency.setValueAtTime(P[0],now);
  if(type==='coin')o.frequency.exponentialRampToValueAtTime(P[0]*1.6,now+P[1]);
  if(type==='bad')o.frequency.exponentialRampToValueAtTime(170,now+P[1]);
  if(type==='good'){ const o2=_actx.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(P[0]*1.5,now+0.07);
    const g2=_actx.createGain(); g2.gain.setValueAtTime(0.0001,now); g2.gain.setValueAtTime(P[3]*.7,now+0.07); g2.gain.exponentialRampToValueAtTime(0.0001,now+0.3);
    o2.connect(g2); g2.connect(_master); o2.start(now); o2.stop(now+0.32); }
  g.gain.setValueAtTime(P[3],now); g.gain.exponentialRampToValueAtTime(0.0001,now+P[1]);
  o.connect(g); g.connect(_master); o.start(now); o.stop(now+P[1]+0.02);
}catch(e){} }
/* ambiente sonoro: água corrente do RAS (ruído marrom filtrado, com leve respiração) */
function updateAmbient(){ if(!_actx) return; const want=PREFS.ambient && !_muted;
  if(want && !_amb){ try{
    const len=_actx.sampleRate*4, buf=_actx.createBuffer(1,len,_actx.sampleRate), d=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; }
    const src=_actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=_actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=620;
    const g=_actx.createGain(); g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(0.16,_actx.currentTime+2.5);
    const lfo=_actx.createOscillator(), lg=_actx.createGain(); lfo.frequency.value=0.08; lg.gain.value=180; lfo.connect(lg); lg.connect(lp.frequency);
    src.connect(lp); lp.connect(g); g.connect(_master); src.start(); lfo.start(); _amb={src,g,lfo};
  }catch(e){} }
  else if(!want && _amb){ try{ _amb.src.stop(); _amb.lfo.stop(); }catch(e){} _amb=null; }
}
function setVolume(v){ PREFS.volume=v; savePrefs(); if(_master) _master.gain.value=v; }
window.setVolume=setVolume;

const clock=new THREE.Clock();
const _skyDay=new THREE.Color('#0a1c22'), _skyDusk=new THREE.Color('#241326'), _skyNight=new THREE.Color('#060d16'), _skyTmp=new THREE.Color();
const _sunDay=new THREE.Color('#ffe9c9'), _sunDusk=new THREE.Color('#ff9d5c'), _sunNight=new THREE.Color('#2a3a5c'), _sunTmp=new THREE.Color();
document.addEventListener('visibilitychange',()=>{ _hidden=document.hidden; if(!_hidden) clock.getDelta(); });
function dayNight(t){
  // fase 0..1 ao longo do "dia de jogo" (~ a cada mês visual), + leve avanço contínuo
  dayPhase = ((G.day%30)/30 + t*0.004) % 1;
  const a = dayPhase*Math.PI*2;
  if(sun){ sun.position.set(Math.cos(a-Math.PI/2)*160, Math.max(8,Math.sin(a)*180), 60+Math.cos(a)*40);
    const up=Math.max(0,Math.sin(a)); // 0 noite, 1 meio-dia
    sun.intensity=0.15+up*1.15;
    if(up>0.35) _sunTmp.copy(_sunDay); else if(up>0.08) _sunTmp.copy(_sunDusk); else _sunTmp.copy(_sunNight);
    sun.color.copy(_sunTmp);
    if(hemi) hemi.intensity=(IS_MOBILE?0.45:.35)+up*.45;
    if(up>0.3) _skyTmp.copy(_skyDay); else if(up>0.06) _skyTmp.lerpColors(_skyNight,_skyDusk,up/0.3); else _skyTmp.copy(_skyNight);
    scene.background.copy(_skyTmp); if(scene.fog) scene.fog.color.copy(_skyTmp);
    if(G.chuva>0){ sun.intensity*=.5; scene.background.multiplyScalar(.72); if(scene.fog) scene.fog.color.multiplyScalar(.72); }
    sunUp=up;
    const dome=window.__skyDome&&window.__skyDome(); if(dome){ dome.material.color.copy(_skyTmp).multiplyScalar(0.6+up*0.7); }
    if(GFX.nightEmissive){ const glow=Math.max(0,1-up*1.4); for(const e of _emissiveNight){ if(e.mesh&&e.mesh.material) e.mesh.material.emissiveIntensity=e.base*glow; } }
  }
}
function animate(){ requestAnimationFrame(animate);
  if(_hidden){ return; }                       // não renderiza com a aba/app em segundo plano (economia)
  try{
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(G.speed>0&&G.started&&!G.over){ acc+=dt*G.speed; const dl=4.0; while(acc>=dl){acc-=dl;tickDay();} }
  // zoom suave
  if(cam.distTarget && Math.abs(cam.dist-cam.distTarget)>0.3 && !camGoal.active){ cam.dist+=(cam.distTarget-cam.dist)*.18; applyCam(); }
  // câmera suave (entrar/sair/focar)
  if(camGoal.active){ cam.target.lerp(camGoal.target,.12);
    cam.az+=(camGoal.az-cam.az)*.12; cam.pol+=(camGoal.pol-cam.pol)*.12; cam.dist+=(camGoal.dist-cam.dist)*.12; cam.distTarget=cam.dist;
    if(cam.target.distanceTo(camGoal.target)<.4&&Math.abs(cam.dist-camGoal.dist)<.6) camGoal.active=false; applyCam(); }
  if(_menuOpen && !camGoal.active){ cam.az+=dt*0.035; applyCam(); }      // órbita lenta no menu principal
  dayNight(t);
  // Rev.16: placas internas só aparecem com a câmera próxima
  if(G.view && G.view!=='top'){ const near=cam.dist<110;
    if(near!==_lblNear){ _lblNear=near; const b=buildings[G.view];
      if(b&&b.group) b.group.traverse(o=>{ if(o.userData&&o.userData.interiorLabel) o.visible=near; }); } }
  // anel de seleção segue o tanque
  if(selRing.visible && G.selected){ const w=tankWorld[G.selected.id]; selRing.position.set(w.x,1.3,w.z);
    selRing.material.opacity=.7+Math.sin(t*5)*.3; const s=1+Math.sin(t*5)*.04; selRing.scale.set(s,s,1); }
  // shimmer global (barato)
  waterInst.material.emissiveIntensity=.45+Math.sin(t*2)*.12;
  if(window.__waterTex){ window.__waterTex.offset.x=(t*0.015)%1; window.__waterTex.offset.y=(t*0.011)%1; }
  pulseReady(t);
  rippleWater(t);
  updateFX(dt,t,(G.speed>0?G.speed:0.4));
  updateRain(dt); growTrees(dt);
  if(_obraGrp && _obraGrp.userData.jib && G.obra && G.obra.ritmo>0) _obraGrp.userData.jib.rotation.y+=dt*(G.speed>0?0.25:0.06);
  if(supplyPipeMat) supplyPipeMat.emissiveIntensity=.4+Math.sin(t*2.5)*.18;
  // cooperados caminhando + trabalhando
  const moving=G.speed>0?G.speed:0.4;
  humans.forEach(h=>{ if(!h.visible)return; const u=h.userData; u.t+=dt*u.spd*moving;
    if(u.t>=1){ u.t=0; u.from=h.position.clone(); u.to=localWander(u.home||u.from); }
    h.position.lerpVectors(u.from,u.to,u.t); h.position.y=Math.abs(Math.sin(u.t*26))*.18;
    h.lookAt(u.to.x,h.position.y,u.to.z);
    const sw=Math.sin(t*9+u.t*6)*.5; u.legL.rotation.x=sw; u.legR.rotation.x=-sw;
    u.armL.rotation.x=-sw*.7; u.armR.rotation.x=sw*.7; });
  }catch(err){ console.error('update error:',err); }
  try{ renderer.render(scene,camera); }catch(err){ console.error('render error:',err); }
}

function updateIndicators(){
  const active=G.tanks.filter(t=>t.state!=='vazio'); const E=teamEff();

  const avgwq=active.length?active.reduce((s,t)=>s+t.wq,0)/active.length:80; st+=(avgwq-60)*0.25;

function readyKg(){ return G.tanks.filter(t=>t.state==='pronto').reduce((s,t)=>s+t.biomass,0); }
function spawnBuyer(){
  if(G.modoDecisoes) return;                     // no Modo decisões a equipe vende no mercado
  const rk=readyKg(); if(rk<300||G.buyers.length>=3) return;
  const tpl=BUYER_POOL[Math.random()*BUYER_POOL.length|0];
  if(tpl.inst && !G.hasPNAE) return; // institucional só com acesso ao programa
  if(tpl.req==='ubp' && !G.hasUBP) return;   // comprador de filé exige UBP
  if(tpl.req==='upp' && !G.hasUPP) return;   // comprador de processados exige UPP
  const base=CFG.pricePerKg*G.priceMul;
  const vol=Math.min(rk, Math.round(tpl.vmin+Math.random()*(tpl.vmax-tpl.vmin)));
  const b={...tpl, id:++G.buyerSeq, price:+(base*tpl.mul).toFixed(2), volume:vol, daysLeft:8, countered:0};
  G.buyers.push(b);
  pushNews(`${tpl.emoji} ${tpl.nome} procura ${fmtKg(vol)} de tilápia a ${money(b.price)}/kg.`, 'info');
  toast('info','💼 Novo comprador',`${tpl.emoji} ${tpl.nome}: "${tpl.fala}" — abra 💼 Compradores.`);
  if(!document.getElementById('modal').classList.contains('show')) openBuyers();
}
function buyerById(id){ return G.buyers.find(b=>b.id===id); }
function fulfillSale(b){
  const E=teamEff(); let need=b.volume, rev=0, n=0, kgSold=0;
  const pr=G.tanks.filter(t=>t.state==='pronto').sort((a,b2)=>b2.biomass-a.biomass);
  for(const t of pr){ if(need<=0)break;
    rev += t.biomass*b.price*(1-CFG.taxRate)*E.sellMul*chainMul(); kgSold+=t.biomass; G.producedKg+=t.biomass; need-=t.biomass; n++; if(n<=6&&tankWorld[t.id])splash(tankWorld[t.id].x,tankWorld[t.id].z);
    t.state='vazio';t.fish=0;t.biomass=0;t.day=0;t.wq=100; }
  if(b.term===0){ G.cash+=rev; G.profitAcc+=rev;
    toast('good','Venda à vista',`${b.emoji} ${b.nome}: ${fmtKg(kgSold)} → ${money(rev)}.`); }
  else { G.receivables.push({due:G.day+b.term, amount:rev, nome:b.nome, emoji:b.emoji, risk:b.risk});
    toast('good','Contrato fechado',`${b.emoji} ${b.nome}: ${fmtKg(kgSold)} → ${money(rev)} em ${b.term} dias.`); }
  pushNews(`${b.emoji} Negócio fechado: ${fmtKg(kgSold)} para ${b.nome} (${money(rev)}${b.term?', a prazo':''}).`,'good');
  G.buyers=G.buyers.filter(x=>x.id!==b.id);
  refreshTanks(); updateHUD(); if(G.selected)renderInspect(); checkWin(); openBuyers();
}

window.buyerCounter=(id,pct)=>{ const b=buyerById(id); if(!b)return;
  const lever=0.5+G.teams.admin*0.06;                       // admin melhora a negociação
  const accProb=Math.max(.04, Math.min(.95, b.pac*(1-pct*(2-lever))));
  if(Math.random()<accProb){ b.price=+(b.price*(1+pct)).toFixed(2);
    toast('good','Contraproposta aceita',`${b.emoji} ${b.nome} topou ${money(b.price)}/kg.`); }
  else { b.countered++;
    if(b.countered>=2 || Math.random()<.35){ G.buyers=G.buyers.filter(x=>x.id!==b.id);
      toast('bad','Comprador desistiu',`${b.emoji} ${b.nome} foi negociar com outro.`);

  openBuyers(); };

/* =====================================================================
   MODO DECISÕES — a equipe cuida da rotina; o grupo só decide
   ===================================================================== */
function autoRotina(){ if(!G.modoDecisoes) return;
  const active=G.tanks.filter(t=>t.state!=='vazio');
  const need=active.reduce((s,t)=>s+feedFor(t),0);
  if(G.feed<Math.max(8000,need*12) && G.cash>60000){ const ton=Math.min(20,Math.floor((CFG.feedMax-G.feed)/1000));
    if(ton>0){ G.cash-=ton*1000*CFG.feedPrice; G.feed+=ton*1000; } }
  if(readyCount()) colherProntos(true);
  // povoamento escalonado e prudente: só povoa se o caixa comporta levar os tanques ativos até a despesca
  const ativos=G.tanks.filter(t=>t.state!=='vazio').length;
  if(G.cash-ativos*8000>80000){ const t=G.tanks.find(t=>t.state==='vazio'); if(t) povoarSil(t); }
  // emergência: caixa muito negativo → despesca antecipada dos tanques mais adiantados
  if(G.cash<CFG.ruinCash*0.55){ const alvo=G.tanks.filter(t=>t.state==='engorda'&&t.day>=110).sort((a,b)=>b.day-a.day).slice(0,3);
    if(alvo.length){ const E=teamEff(); let tot=0;
      alvo.forEach(t=>{ const liq=t.biomass*CFG.pricePerKg*G.priceMul*E.priceMul*E.sellMul*chainMul()*(1-CFG.taxRate);
        G.cash+=liq; G.profitAcc+=liq; G.producedKg+=t.biomass; tot+=liq; t.state='vazio'; t.fish=0; t.biomass=0; t.day=0; t.wq=100; });
      toastEvery('emerg',5,'warn','Despesca antecipada',`Caixa no vermelho: a equipe despescou ${alvo.length} tanque(s) antes do ponto (${money(tot)}).`); } }
}

function conselhoAtivo(){ return Object.keys(G.conselhos||{}).length>0; }

   <div class="setrow"><div class="l"><b>Jovens (16 a 29 anos)</b><p>Participação da juventude da pesca.</p></div>${st('jovens',f.jovens,0,5)}</div>
   <div class="checks">${ch.map(c=>`<div class="${c.ok?'ok':'no'}"><span>${c.ok?'✔':'✖'}</span>${c.t} <em>${c.a}</em></div>`).join('')}</div>

     <span>${ok?(cash?'Realizar a eleição e iniciar a obra':'Caixa insuficiente para a contrapartida'):'Ajuste a composição para cumprir o estatuto'}</span><small>contrapartida ${money(b.cost)}</small></button>`); }
window.gaoAdj=(k,d)=>{ const f=_gaoForm; f[k]+=d;
  f.membros=Math.max(5,Math.min(25,f.membros)); f.mulheres=Math.max(0,Math.min(f.membros,f.mulheres)); f.jovens=Math.max(0,Math.min(5,f.jovens));
  openGaoElection(); };
window.confirmGao=()=>{ const f=_gaoForm; if(!gaoChecks().every(c=>c.ok)) return;

function startObra(id){ const b=BUILDS.find(x=>x.id===id); if(!b) return;

  updateHUD(); }
function tickGovernanca(){
  if(G.chuva>0) G.chuva--;
  if(G.obra){ const o=G.obra;
    if(o.ritmoDias>0){ o.ritmoDias--; if(!o.ritmoDias) o.ritmo=1; }
    o.prog=Math.min(100,o.prog+(100/CFG.obraDias)*o.ritmo); updateObraVisual();
    if(o.prog>=100){ if(!_decisionOpen) inaugurar(); return; }
    const k=G.day-o.start; if(k>0 && k%20===10 && G.day%30!==0) triggerDecision('gao'); }
  if(G.modoDecisoes && !_decisionOpen && (G.day%30===10 || G.day%30===20)) triggerDecision('demanda');
}

function openConselhos(){ const id=_consForm.id, M=G.gao?G.gao.membros:12, cae=_consForm.cae, base=Math.max(0,M-cae), cfe=Math.max(7,base), compl=cfe-base;

   <div class="kpis">
     <div class="kpi"><div class="k">Pró-labore do CAE</div><div class="v">${money(cae*1200)}</div><div class="d">por mês</div></div>

     <div class="kpi"><div class="k">Fiscalização (CFE)</div><div class="v" style="color:var(--mint)">ativa</div><div class="d">+ confiança · controle social</div></div>
   </div>
   <button class="btn primary" style="justify-content:center" onclick="confirmConselhos()">Empossar o CAE e o CFE</button>`); }
window.consAdj=d=>{ _consForm.cae=Math.max(3,Math.min(7,_consForm.cae+d)); openConselhos(); };
window.confirmConselhos=()=>{ const id=_consForm.id, M=G.gao?G.gao.membros:12, cae=_consForm.cae, cfe=Math.max(7,M-cae);

/* ----------------- canteiro de obra (muda o cenário conforme o progresso) ----------------- */
let _obraGrp=null;
function buildObraSite(id){ removeObraSite(); const P=OBRA_POS[id]; if(!P||!scene) return;
  if(futureLots[id]){ scene.remove(futureLots[id]); delete futureLots[id]; }
  const g=new THREE.Group(); g.userData.obra=id;
  const tap=mat('#d9d2c0',{roughness:.9}), h=2.2;
  for(const dz of [-P.d/2,P.d/2]){ const m=new THREE.Mesh(new THREE.BoxGeometry(P.w,h,.2),tap); m.position.set(P.x,h/2,P.z+dz); g.add(m); }
  for(const dx of [-P.w/2,P.w/2]){ const m=new THREE.Mesh(new THREE.BoxGeometry(.2,h,P.d),tap); m.position.set(P.x+dx,h/2,P.z); g.add(m); }
  const slab=new THREE.Mesh(new THREE.BoxGeometry(P.w-4,.4,P.d-4),mat('#b7b2a6',{roughness:.95})); slab.position.set(P.x,.2,P.z); slab.receiveShadow=true; g.add(slab);
  const walls=new THREE.Mesh(new THREE.BoxGeometry(P.w-6,3.6,P.d-6),mat('#c9c3b5',{roughness:.85})); walls.position.set(P.x,.4,P.z); walls.scale.y=.02; g.add(walls); g.userData.walls=walls;
  const pm=mat('#8a8f93',{metalness:.5,roughness:.5});
  for(let i=0;i<=5;i++) for(const dz of [-(P.d-6)/2,(P.d-6)/2]){ const p=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,5.2,6),pm); p.position.set(P.x-(P.w-6)/2+i*(P.w-6)/5,2.6,P.z+dz); g.add(p); }
  const ym=mat('#e0b23a',{metalness:.3,roughness:.5}), cx=P.x+P.w/2-6, cz=P.z-P.d/2+5;
  const tower=new THREE.Mesh(new THREE.BoxGeometry(1.2,20,1.2),ym); tower.position.set(cx,10,cz); g.add(tower);
  const jib=new THREE.Group(); jib.position.set(cx,20,cz);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(26,.8,.8),ym); arm.position.set(-8,0,0); jib.add(arm);
  const cw=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.6,1.6),mat('#5b6268')); cw.position.set(4.5,-.6,0); jib.add(cw);
  const cable=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,10,4),mat('#333333')); cable.position.set(-16,-5,0); jib.add(cable);
  const load=new THREE.Mesh(new THREE.BoxGeometry(1.6,1,1.6),mat('#9a7b4f')); load.position.set(-16,-10.2,0); jib.add(load);
  g.add(jib); g.userData.jib=jib;
  for(let i=0;i<4;i++){ const m=new THREE.Mesh(new THREE.BoxGeometry(2.2,1,2.2),mat(i%2?'#b3432e':'#a39e93')); m.position.set(P.x-P.w/2+5+i*3,.5,P.z+P.d/2-4); g.add(m); }
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  const lab=makeLabel('🏗️ Obra — '+OBRA_NOME[id]+' · GAO',5.2); lab.position.set(P.x,9,P.z); g.add(lab);
  scene.add(g); _obraGrp=g; updateObraVisual(); }
function removeObraSite(){ if(_obraGrp){ scene.remove(_obraGrp); _obraGrp=null; } }
function updateObraVisual(){ if(!_obraGrp||!G.obra) return; const w=_obraGrp.userData.walls, k=Math.max(.02,G.obra.prog/100);
  w.scale.y=k; w.position.y=.4+1.8*k; }

/* ----------------- chuva (cenário) ----------------- */
let _rain=null;
function startRain(days){ G.chuva=Math.max(G.chuva||0,days); ensureRain(); }
function ensureRain(){ if(_rain||!scene) return; const N=IS_MOBILE?600:1800, g=new THREE.BufferGeometry(), a=new Float32Array(N*6);
  for(let i=0;i<N;i++){ const x=(Math.random()-.5)*320, y=Math.random()*90, z=(Math.random()-.5)*320+20;
    a[i*6]=x; a[i*6+1]=y; a[i*6+2]=z; a[i*6+3]=x+.25; a[i*6+4]=y+2.4; a[i*6+5]=z; }
  g.setAttribute('position',new THREE.BufferAttribute(a,3));
  _rain=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:'#cfe6ee',transparent:true,opacity:.55,depthWrite:false}));
  _rain.frustumCulled=false; _rain.visible=false; scene.add(_rain); }
function updateRain(dt){ const on=(G.chuva||0)>0; if(on) ensureRain(); if(!_rain) return; _rain.visible=on; if(!on) return;
  const p=_rain.geometry.attributes.position, a=p.array, d=dt*75;
  for(let i=0;i<a.length;i+=6){ a[i+1]-=d; a[i+4]-=d; if(a[i+1]<0){ a[i+1]+=90; a[i+4]+=90; } } p.needsUpdate=true; }

/* ----------------- árvores plantadas em mutirão (cenário) ----------------- */
const _growing=[]; let _treeMats=null;
function plantTrees(n,instant){ if(!scene) return;
  if(!_treeMats) _treeMats={trunk:mat('#5b4326',{roughness:1}), fol:['#3f7d3a','#4f8f44','#356b34','#5a9a4a'].map(c=>mat(c,{roughness:.95,flatShading:true})),
    tg:new THREE.CylinderGeometry(.35,.5,4,6), fg:new THREE.IcosahedronGeometry(2.6,0)};
  for(let i=0;i<n;i++){ const side=Math.random()*3|0; let x,z;
    if(side===0){ x=-30+Math.random()*126; z=151+Math.random()*5; }
    else if(side===1){ x=-116+Math.random()*14; z=-5+Math.random()*58; }
    else { x=102+Math.random()*16; z=-5+Math.random()*118; }
    const g=new THREE.Group(); g.position.set(x,0,z);
    const t=new THREE.Mesh(_treeMats.tg,_treeMats.trunk); t.position.y=2; g.add(t);
    const f=new THREE.Mesh(_treeMats.fg,_treeMats.fol[i%4]); f.position.y=4.6; f.rotation.y=Math.random()*6; g.add(f);
    g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
    const target=.6+Math.random()*.5;
    if(instant) g.scale.setScalar(target); else { g.scale.setScalar(.01); g.userData.target=target; g.userData.delay=i*0.15; _growing.push(g); }
    scene.add(g); } }
function growTrees(dt){ for(let i=_growing.length-1;i>=0;i--){ const g=_growing[i];
  if(g.userData.delay>0){ g.userData.delay-=dt; continue; }
  const s=g.scale.x+(g.userData.target-g.scale.x)*Math.min(1,dt*2.2); g.scale.setScalar(s);
  if(Math.abs(s-g.userData.target)<.01){ g.scale.setScalar(g.userData.target); _growing.splice(i,1); } } }

const SAVE_FIELDS=['day','cash','feed','profitAcc','wells','hasGen','hasSolar','hasNet','hasTruck','hasUBP','hasUPP',
  'priceMul','priceTimer','outage','teams','tanks','news','buyers','receivables','buyerSeq','hasPNAE','_moraleDays',
  'sustentabilidade','confianca','producedKg','oficina','monthSnap','history','_tt','_ubpAviso','_uppAviso',
  'cidade','modoDecisoes','gao','obra','conselhos','atas','_ataSeq','devolutivas','lastDevol','_gaoInfra','chuva','_arvores','_recentDec','_readyAnn'];
function saveGame(silent){
  if(!G.started||G.over) return false;
  const g={}; SAVE_FIELDS.forEach(k=>{ g[k]=G[k]; });
  const ok=lsSet(SAVE_KEY,{v:1, at:Date.now(), g});
  if(!silent) toast(ok?'good':'bad', ok?'Jogo salvo':'Não foi possível salvar',
    ok?`Progresso do mês ${Math.min(12,Math.floor(G.day/30)+1)} guardado neste navegador.`:'O navegador bloqueou o armazenamento local.');
  return ok;
}
function saveInfo(){ const d=lsGet(SAVE_KEY); if(!d||!d.g||!Array.isArray(d.g.tanks)||d.g.tanks.length!==G.tanks.length) return null;
  return { mes:Math.min(12,Math.floor((d.g.day||0)/30)+1), cash:d.g.cash||0, when:timeAgo(d.at) }; }
function timeAgo(t){ if(!t) return ''; const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'agora mesmo'; if(m<60) return `há ${m} min`; const h=Math.round(m/60); if(h<24) return `há ${h} h`;
  const d=Math.round(h/24); return d===1?'ontem':`há ${d} dias`; }
function loadGame(){
  const d=lsGet(SAVE_KEY); if(!d||!d.g) return false;
  SAVE_FIELDS.forEach(k=>{ if(d.g[k]!==undefined) G[k]=d.g[k]; });
  G.history=G.history||[]; G._tt=G._tt||{}; G.selected=null; G.tool='inspect'; G.view='top';
  // reconstrói no cenário o que já foi investido
  if(G.hasSolar) buildSolar();
  if(G.hasTruck) buildTruck();
  if(G.hasUBP) buildUBP();
  if(G.hasUPP) buildUPP();
  G.conselhos=G.conselhos||{}; G.atas=G.atas||[];
  if(G.obra) buildObraSite(G.obra.id);
  if(G._arvores) plantTrees(14*G._arvores,true);
  if(G.chuva>0) ensureRain();
  for(let w=3; w<=G.wells; w++) wellMesh(-108,-10+(w-1)*14,w);
  assignHumanJobs(); refreshTanks(); updateHUD(); updateAlerts();
  if(G.news.length){ document.getElementById('ticker').style.display='block'; updateTicker(); }
  return true;
}

function barChart(vals,labels){ const W=300,H=96,pad=14; if(!vals.length) return '';
  const mx=Math.max(1,...vals.map(v=>Math.abs(v))), n=vals.length, bw=Math.min(26,(W-pad*2)/n*0.66), zero=H/2;
  const bars=vals.map((v,i)=>{ const x=pad+(i+.5)*(W-pad*2)/n-bw/2, h=Math.max(1.5,Math.abs(v)/mx*(H/2-12));
    return `<rect x="${x.toFixed(1)}" y="${(v>=0?zero-h:zero).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5" fill="${v>=0?'#7df0a6':'#ff6b5e'}" opacity="${i===n-1?1:.6}"><title>${labels[i]}: ${money(v)}</title></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${H-1}" text-anchor="middle" font-size="8" fill="#5d8488">${labels[i]}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><line x1="${pad}" x2="${W-pad}" y1="${zero}" y2="${zero}" stroke="#1c4651"/>${bars}</svg>`; }
function lineChart(vals,labels){ const W=300,H=96,pad=14; if(vals.length<2) return '';
  const mn=Math.min(0,...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const X=i=>pad+i*(W-pad*2)/(vals.length-1), Y=v=>H-16-(v-mn)/rg*(H-30);
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <line x1="${pad}" x2="${W-pad}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="#1c4651" stroke-dasharray="3 3"/>
    <polygon points="${X(0).toFixed(1)},${Y(mn).toFixed(1)} ${pts} ${X(vals.length-1).toFixed(1)},${Y(mn).toFixed(1)}" fill="rgba(38,226,207,.12)"/>
    <polyline points="${pts}" fill="none" stroke="#26e2cf" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="#26e2cf"><title>${labels[i]}: ${money(v)}</title></circle>
      <text x="${X(i).toFixed(1)}" y="${H-1}" text-anchor="middle" font-size="8" fill="#5d8488">${labels[i]}</text>`).join('')}</svg>`; }
function scoreRing(pct){ const r=38, c=2*Math.PI*r, col=pct>=75?'#7df0a6':pct>=50?'#f5b13d':'#ff6b5e';
  return `<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#0a2026" stroke-width="8"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#dff4f3" font-family="Saira Semi Condensed, sans-serif">${Math.round(pct)}</text></svg>`; }

function toastEvery(key,days,type,title,msg){ const last=G._tt[key]; if(last!==undefined && G.day-last<days) return;
  G._tt[key]=G.day; toast(type,title,msg); }
function toast(type,title,msg,quiet){ if(quiet && !PREFS.routine) return;
  const log=document.getElementById('log'), el=document.createElement('div');
  if(!quiet&&(type==='good'||type==='warn'||type==='bad')) sfx(type);
  el.className='toast '+type; el.innerHTML=`<b>${title}</b> <span class="t">— dia ${G.day}</span><br>${msg}`;
  log.appendChild(el); while(log.children.length>5)log.removeChild(log.firstChild);
  setTimeout(()=>{el.style.transition='opacity .5s';el.style.opacity='0';setTimeout(()=>el.remove(),500);},quiet?7000:12000); }

function fmtKg(kg){return kg>=1000?(kg/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' t':Math.round(kg).toLocaleString('pt-BR')+' kg';}

  let auto=false; try{ auto=sessionStorage.getItem('aquipolis-autostart')==='1'; sessionStorage.removeItem('aquipolis-autostart'); }catch(e){}
  if(auto) openIntro(); else showMainMenu(); }
bootStatus('Construindo a unidade aquícola…');
requestAnimationFrame(()=>setTimeout(()=>{
  try{ initThree(); renderTools(); updateHUD();
    document.getElementById('lblToggle').classList.toggle('on',GFX.showLabels);
    document.getElementById('muteBtn').innerHTML=icon(_muted?'mute':'vol');
    bootStatus('Pronto!'); setTimeout(finishBoot,250); }
  catch(err){ console.error(err); const b=document.getElementById('boot'); if(b) b.remove();
    document.getElementById('app').innerHTML='<div style="position:absolute;inset:0;display:flex;'+
    'align-items:center;justify-content:center;padding:30px;text-align:center;font-family:sans-serif;'+
    'color:#dff4f3;background:#07151a"><div><h2 style="color:#26e2cf">Falha ao iniciar o cenário 3D</h2>'+
    '<p style="color:#8fb8b8;max-width:420px;margin:10px auto">'+(err&&err.message?err.message:err)+
    '</p><p style="color:#5d8488;font-size:12px">Verifique se o navegador suporta WebGL e tente recarregar a página.</p></div></div>'; }
},40));
</script>
