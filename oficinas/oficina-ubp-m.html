<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Oficina UBP-M — Rota da Tilápia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EAEFEE; --surface:#FFFFFF; --surface-2:#F5F8F7; --surface-3:#E4ECEA;
  --ink:#0C2429; --ink-2:#41585E; --ink-3:#7B9095;
  --line:#D2DEDC; --line-2:#B4C6C4;
  --accent:#0F6F7A; --accent-ink:#0A4F58; --accent-soft:#D6EAEC;
  --start:#2E7D5B; --end:#A33A2E; --gate:#A8760F; --ext:#5B6E7A;
  --ok:#2E7D5B; --warn:#A8760F; --bad:#A33A2E;
  --shadow:0 1px 2px rgba(12,36,41,.06), 0 8px 24px -12px rgba(12,36,41,.18);
  --on-accent:#FFFFFF;
  --ui:1;
  --f-display:'Archivo', ui-sans-serif, system-ui, sans-serif;
  --f-body:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#081316; --surface:#0E1F24; --surface-2:#132A30; --surface-3:#19353C;
    --ink:#E2EDEB; --ink-2:#A6BEBE; --ink-3:#72908F;
    --line:#1E393F; --line-2:#2D5159;
    --accent:#4FBCC3; --accent-ink:#9EE3E7; --accent-soft:#103238;
    --start:#52B489; --end:#E38173; --gate:#DBAA43; --ext:#8CA6B1;
    --ok:#52B489; --warn:#DBAA43; --bad:#E38173;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --on-accent:#04191C;
  }
}
:root[data-theme="dark"]{
  --ground:#081316; --surface:#0E1F24; --surface-2:#132A30; --surface-3:#19353C;
  --ink:#E2EDEB; --ink-2:#A6BEBE; --ink-3:#72908F;
  --line:#1E393F; --line-2:#2D5159;
  --accent:#4FBCC3; --accent-ink:#9EE3E7; --accent-soft:#103238;
  --start:#52B489; --end:#E38173; --gate:#DBAA43; --ext:#8CA6B1;
  --ok:#52B489; --warn:#DBAA43; --bad:#E38173;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --on-accent:#04191C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);
  font-size:calc(15px * var(--ui));line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{display:flex;flex-direction:column;height:100%;min-height:0}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:6}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer;background:none;border:0;padding:4px 6px;margin-left:-6px;border-radius:6px}
.brand:hover{background:var(--surface-2)}
.brand b{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:1.12em}
.brand span{font-size:.78em;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.bar .grow{flex:1 1 auto}
.phase-chip{font-family:var(--f-mono);font-size:.74em;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);
  padding:4px 9px;border-radius:999px;white-space:nowrap}
select.pick{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;max-width:min(46vw,420px);font-size:.92em;font-weight:500}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;cursor:pointer;font-size:.88em;font-weight:500;white-space:nowrap;
  transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-3);border-color:var(--line-2)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.icon{font-family:var(--f-mono);font-weight:600;padding:6px 9px}

/* ---------- home ---------- */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;padding-block:clamp(24px,5vh,56px)}
.hero{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:28px}
.kicker{font-family:var(--f-mono);font-size:.76em;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:12px}
h1{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;line-height:1.04;
  font-size:clamp(2rem,5.4vw,3.4rem);margin:0 0 12px;text-wrap:balance}
.lede{font-size:clamp(1rem,2vw,1.2rem);color:var(--ink-2);max-width:60ch;margin:0 0 18px}
.facts{display:flex;flex-wrap:wrap;gap:8px 10px;font-family:var(--f-mono);font-size:.8em;color:var(--ink-2)}
.facts span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 9px;
  font-variant-numeric:tabular-nums}
.phases{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr))}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;
  padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .16s,border-color .16s}
.pcard:hover{transform:translateY(-2px);border-color:var(--line-2);border-left-color:var(--accent)}
.pcard .num{font-family:var(--f-mono);font-size:.74em;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.pcard h3{font-family:var(--f-display);font-weight:700;font-size:1.16em;margin:0;letter-spacing:-.015em}
.pcard p{margin:0;font-size:.92em;color:var(--ink-2)}
.pcard .meta{margin-top:auto;padding-top:8px;font-family:var(--f-mono);font-size:.76em;color:var(--ink-3)}
h2.sec{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;font-size:1.5rem;
  margin:34px 0 4px}
.sec-note{color:var(--ink-2);margin:0 0 16px;font-size:.95em;max-width:62ch}

/* process grid */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.dcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:13px 14px;cursor:pointer;
  transition:border-color .15s,background .15s}
.dcard:hover{border-color:var(--accent);background:var(--surface-2)}
.dcard .code{font-family:var(--f-mono);font-size:.76em;font-weight:600;color:var(--accent);letter-spacing:.04em}
.dcard b{font-family:var(--f-display);font-weight:600;font-size:1em;line-height:1.25;letter-spacing:-.01em}
.dcard .meta{font-family:var(--f-mono);font-size:.74em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:5px;
  vertical-align:middle}

/* ---------- player ---------- */
.stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.95fr)}
.canvas-wrap{position:relative;min-width:0;min-height:0;background:var(--surface-2);
  border-right:1px solid var(--line);overflow:hidden}
svg.diagram{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
svg.diagram.drag{cursor:grabbing}
.canvas-tools{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:3}
.canvas-tools .btn{background:var(--surface);box-shadow:var(--shadow)}
.canvas-title{position:absolute;left:14px;top:12px;z-index:3;pointer-events:none;
  font-family:var(--f-display);font-weight:700;font-size:.96em;letter-spacing:-.01em;
  background:color-mix(in srgb, var(--surface) 88%, transparent);border:1px solid var(--line);
  padding:5px 10px;border-radius:7px;max-width:60%}

/* shapes */
.lane-band{fill:var(--surface);stroke:var(--line-2)}
.lane-band.alt{fill:var(--surface-2)}
.pool-frame{fill:none;stroke:var(--line-2);stroke-width:1.2}
.pool-head{fill:var(--surface-3);stroke:var(--line-2)}
.xpool{fill:var(--surface-3);stroke:var(--ext);stroke-width:1}
.lane-name,.pool-name{font-family:var(--f-body);font-weight:600;fill:var(--ink-2)}
.node{transition:opacity .38s ease}
.node .body{fill:var(--surface);stroke:var(--line-2);stroke-width:1.1}
.node.task .body{fill:var(--surface)}
.node.subprocess .body{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.node.start .body{fill:none;stroke:var(--start);stroke-width:1.6}
.node.end .body{fill:none;stroke:var(--end);stroke-width:2.6}
.node.intermediate .body,.node.boundary .body{fill:none;stroke:var(--gate);stroke-width:1.4}
.node.gateway .body{fill:var(--surface);stroke:var(--gate);stroke-width:1.4}
.node .glyph{fill:none;stroke:var(--ink-2);stroke-width:1.1;stroke-linecap:round}
.node text{font-family:var(--f-body);fill:var(--ink);font-weight:500}
.node.dim{opacity:.13}
.node.cur .body{stroke:var(--accent);stroke-width:2.4}
.node.cur text{font-weight:700}
.halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:.28}
.edge{fill:none;stroke:var(--ink-3);stroke-width:1.1;transition:opacity .38s ease}
.edge.msg{stroke:var(--ext);stroke-dasharray:4 3}
.edge.dim{opacity:.1}
.edge-label{font-family:var(--f-body);font-size:6px;fill:var(--ink-2);font-weight:600}
.note-txt{font-family:var(--f-body);fill:var(--ink-3)}

/* ---------- side panel ---------- */
.side{display:flex;flex-direction:column;min-height:0;background:var(--surface);overflow:hidden}
.side-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.lane-tag{display:inline-flex;align-items:center;gap:7px;font-size:.82em;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;max-width:100%}
.lane-tag i{width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}
.step-head{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.step-n{font-family:var(--f-mono);font-size:.82em;font-weight:600;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.kind{font-family:var(--f-mono);font-size:.72em;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid currentColor}
.kind.task{color:var(--ink-2)} .kind.subprocess{color:var(--accent)}
.kind.start{color:var(--start)} .kind.end{color:var(--end)}
.kind.gateway,.kind.intermediate,.kind.boundary{color:var(--gate)}
h2.step-title{font-family:var(--f-display);font-weight:700;letter-spacing:-.025em;line-height:1.12;
  font-size:clamp(1.35rem,2.4vw,2rem);margin:0 0 10px;text-wrap:balance}
.step-doc{color:var(--ink-2);font-size:1.02em;margin:0 0 14px;max-width:58ch}
.step-doc.empty{color:var(--ink-3);font-style:italic}
.branches{display:flex;flex-direction:column;gap:7px;margin:0 0 16px}
.branch{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);
  border:1px solid var(--line);border-left:3px solid var(--gate);border-radius:7px;padding:8px 11px;font-size:.94em}
.branch b{font-family:var(--f-mono);font-size:.84em;letter-spacing:.04em;text-transform:uppercase;
  color:var(--gate);flex:none;padding-top:1px}
.msgs{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.msg{display:flex;gap:8px;align-items:flex-start;font-size:.9em;color:var(--ink-2);
  border-left:3px solid var(--ext);padding:4px 0 4px 10px}
.msg b{color:var(--ext);font-weight:600;flex:none}
.block-label{font-family:var(--f-mono);font-size:.72em;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin:20px 0 9px;padding-top:16px;border-top:1px solid var(--line)}
.marks{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.mark{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
  padding:6px 13px;cursor:pointer;font-size:.88em;font-weight:500;transition:all .14s}
.mark:hover{border-color:var(--line-2)}
.mark[aria-pressed="true"]{color:var(--on-accent);border-color:transparent}
.mark.ok[aria-pressed="true"]{background:var(--ok)}
.mark.warn[aria-pressed="true"]{background:var(--warn)}
.mark.bad[aria-pressed="true"]{background:var(--bad)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.88em;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;resize:vertical;min-height:62px;font-size:.96em}
.field textarea:focus{border-color:var(--accent);background:var(--surface)}

/* ---------- rail ---------- */
.rail{display:flex;align-items:center;gap:10px;padding:9px 16px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.rail .nav{display:flex;gap:6px;flex:none}
.ticks{flex:1 1 auto;display:flex;align-items:center;gap:3px;overflow-x:auto;padding:4px 0}
.tick{flex:none;width:13px;height:13px;border-radius:4px;border:1px solid var(--line-2);
  background:var(--surface-2);cursor:pointer;position:relative;transition:all .15s}
.tick:hover{border-color:var(--accent)}
.tick.done{background:var(--accent-soft);border-color:var(--accent)}
.tick.cur{background:var(--accent);border-color:var(--accent);transform:scale(1.22)}
.tick.ok{background:var(--ok);border-color:var(--ok)}
.tick.warn{background:var(--warn);border-color:var(--warn)}
.tick.bad{background:var(--bad);border-color:var(--bad)}
.tick.flowstart{margin-left:12px;box-shadow:-7px 0 0 -3px var(--line-2)}
.count{font-family:var(--f-mono);font-size:.84em;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}

/* ---------- closing ---------- */
.note-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:12px}
.note-card h4{font-family:var(--f-display);font-weight:700;margin:0 0 3px;font-size:1.05em}
.note-card .src{font-family:var(--f-mono);font-size:.75em;color:var(--ink-3);margin-bottom:9px}
.note-card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.94em}
.note-card dt{font-weight:600;color:var(--ink-3);font-size:.9em}
.note-card dd{margin:0;color:var(--ink-2)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.72em;font-weight:600;
  padding:2px 8px;border-radius:999px;color:var(--on-accent);letter-spacing:.04em}
.pill.ok{background:var(--ok)} .pill.warn{background:var(--warn)} .pill.bad{background:var(--bad)}
.empty-state{color:var(--ink-3);border:1px dashed var(--line-2);border-radius:10px;padding:26px;text-align:center}

/* ---------- legend modal ---------- */
.veil{position:fixed;inset:0;background:rgba(8,20,22,.55);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:40}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:660px;
  width:100%;max-height:86vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow)}
.modal h3{font-family:var(--f-display);font-weight:700;margin:0 0 4px;font-size:1.3em;letter-spacing:-.02em}
.leg{display:grid;grid-template-columns:52px 1fr;gap:12px 14px;align-items:center;margin-top:18px}
.leg svg{display:block}
.leg p{margin:0;font-size:.95em;color:var(--ink-2)}
.leg b{color:var(--ink);font-weight:600}

@media (max-width: 900px){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(190px,40vh) minmax(0,1fr)}
  .canvas-wrap{border-right:0;border-bottom:1px solid var(--line)}
  .canvas-title{font-size:.84em;max-width:72%}
  .side-scroll{padding:14px 16px}
}
</style>

</head>
<body>

try { notes = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { notes = {}; }
function save(){ try { localStorage.setItem(LS, JSON.stringify(notes)); } catch (e) {} }
const nkey = (d, n) => d + '#' + n;
const getNote = (d, n) => notes[nkey(d, n)] || {};
function setNote(d, n, patch){
  const k = nkey(d, n), cur = notes[k] || {};
  const next = Object.assign({}, cur, patch);
  if (!next.mark && !(next.quem || '').trim() && !(next.obs || '').trim()) delete notes[k];
  else notes[k] = next;
  save();
}

let S = { view:'home', dg:null, step:0, all:false, ui:1 };
try { const s = JSON.parse(localStorage.getItem(LS + '-ui') || '{}'); if (s.ui) { S.ui = s.ui; document.documentElement.style.setProperty('--ui', s.ui); } } catch (e) {}

/* ---------- model helpers ---------- */
const D = {}; U.diagrams.forEach(d => D[d.id] = d);
const N0 = U.diagrams.find(d => d.id === 'N0');
const N1 = U.diagrams.find(d => d.id === 'N1');
const PROCS = U.diagrams.filter(d => d.id !== 'N0' && d.id !== 'N1');

function kindOf(t){
  t = t || '';
  if (/^Subprocesso/i.test(t)) return 'subprocess';
  if (/^Evento de in/i.test(t)) return 'start';
  if (/^Evento de fim/i.test(t)) return 'end';
  if (/^Evento de borda/i.test(t)) return 'boundary';
  if (/^Evento intermedi/i.test(t)) return 'intermediate';
  if (/^Gateway/i.test(t)) return 'gateway';
  return 'task';
}
const kindWord = { task:'Tarefa', subprocess:'Subprocesso', start:'Início', end:'Fim',
  gateway:'Decisão', intermediate:'Espera', boundary:'Interrupção' };
function glyphOf(t){
  if (/temporizador/i.test(t)) return 'timer';
  if (/mensagem/i.test(t)) return 'msg';
  if (/paralelo/i.test(t)) return 'and';
  if (/exclusivo/i.test(t)) return 'xor';
  if (/^Subprocesso/i.test(t)) return 'plus';
  if (/condicional/i.test(t)) return 'cond';
  return null;
}
function laneColor(d, lane){
  const i = Math.max(0, (d.lanes || []).indexOf(lane));
  const hues = [188, 152, 36, 268, 6, 210];
  return 'hsl(' + hues[i % hues.length] + ' 46% 42%)';
}
function flowsOf(d){
  const groups = []; let cur = null;
  d.elements.forEach((e, i) => {
    if (!cur || kindOf(e.type) === 'start') { cur = { name:e.name, from:i, idx:[] }; groups.push(cur); }
    cur.idx.push(i);
  });
  return groups;
}
function annCount(id){
  let n = 0; for (const k in notes) if (k.split('#')[0] === id) n++;
  return n;
}

/* ---------- text wrapping ---------- */
function wrapText(str, maxW, size, weight){
  mctx.font = (weight || 500) + ' ' + size + 'px "IBM Plex Sans", sans-serif';
  const words = String(str).split(/\s+/).filter(Boolean);
  const lines = []; let line = '';
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (mctx.measureText(t).width <= maxW || !line) line = t;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}
function fitText(str, maxW, size){
  mctx.font = '500 ' + size + 'px "IBM Plex Sans", sans-serif';
  if (mctx.measureText(str).width <= maxW) return str;
  let s = str;
  while (s.length > 2 && mctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
const el = (tag, attrs, kids) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  (kids || []).forEach(c => n.appendChild(c));
  return n;
};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- diagram rendering ---------- */
function bounds(d){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const add = (a, b, c, e) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, e); };
  d.pools.forEach(p => add(p.x, p.y, p.x + p.w, p.y + p.h));
  d.shapes.forEach(s => add(s.x, s.y, s.x + s.w, s.y + s.h));
  d.edges.forEach(e => e.pts.forEach(p => add(p[0], p[1], p[0], p[1])));
  (d.notes || []).forEach(n => add(n.x, n.y, n.x + n.w, n.y + n.fs));
  if (x0 > x1) { x0 = 0; y0 = 0; x1 = d.page.w; y1 = d.page.h; }
  const m = 14;
  return { x:x0 - m, y:y0 - m, w:(x1 - x0) + m * 2, h:(y1 - y0) + m * 2 };
}

function buildSvg(d){
  const B = bounds(d);
  const svg = el('svg', { class:'diagram', viewBox:[B.x, B.y, B.w, B.h].join(' '),
    preserveAspectRatio:'xMidYMid meet', role:'img' });
  svg._base = B;

  const defs = el('defs');
  [['ar','var(--ink-3)'],['ar-msg','var(--ext)'],['ar-cur','var(--accent)']].forEach(([id, col]) => {
    defs.appendChild(el('marker', { id:id, viewBox:'0 0 8 8', refX:'7', refY:'4',
      markerWidth:'5', markerHeight:'5', orient:'auto-start-reverse' },
      [el('path', { d:'M0.5,0.8 L7.4,4 L0.5,7.2 z', fill:col })]));
  });
  svg.appendChild(defs);

  const gLanes = el('g'), gEdges = el('g'), gNodes = el('g'), gNotes = el('g');
  svg.appendChild(gLanes); svg.appendChild(gNotes); svg.appendChild(gEdges); svg.appendChild(gNodes);

  /* pools + lanes */
  d.pools.forEach(p => {
    if (p.collapsed){
      gLanes.appendChild(el('rect', { class:'xpool', x:p.x, y:p.y, width:p.w, height:p.h, rx:3 }));
      const fs = Math.min(8, p.h * 0.46);
      const t = el('text', { class:'pool-name', x:p.x + p.w / 2, y:p.y + p.h / 2,
        'text-anchor':'middle', 'dominant-baseline':'central', 'font-size':fs });
      t.textContent = fitText(p.name, p.w - 8, fs);
      gLanes.appendChild(t);
    } else {
      gLanes.appendChild(el('rect', { class:'pool-frame', x:p.x, y:p.y, width:p.w, height:p.h, rx:2 }));
    }
  });
  const lanes = (d.lanesGeo || []).slice().sort((a, b) => a.y - b.y);
  lanes.forEach((L, i) => {
    gLanes.appendChild(el('rect', { class:'lane-band' + (i % 2 ? ' alt' : ''), x:L.x, y:L.y, width:L.w, height:L.h }));
    const head = Math.min(13, L.w * 0.02);
    gLanes.appendChild(el('rect', { class:'pool-head', x:L.x, y:L.y, width:head, height:L.h }));
    if (L.name){
      const fs = Math.min(7.5, head * 0.62);
      const cx = L.x + head / 2, cy = L.y + L.h / 2;
      const t = el('text', { class:'lane-name', x:cx, y:cy, 'font-size':fs,
        'text-anchor':'middle', 'dominant-baseline':'central',
        transform:'rotate(-90 ' + cx + ' ' + cy + ')' });
      t.textContent = fitText(L.name, L.h - 6, fs);
      gLanes.appendChild(t);
    }
  });

  /* free-floating labels (message names, data) */
  (d.notes || []).forEach(n => {
    const fs = Math.max(4.6, Math.min(6.4, n.fs || 5.5));
    const t = el('text', { class:'note-txt', x:n.x, y:n.y + fs * 0.85, 'font-size':fs });
    t.textContent = n.s; gNotes.appendChild(t);
  });

  /* which shape belongs to which step */
  const stepOf = {};
  d.elements.forEach((e, i) => { if (e.shape) stepOf[e.shape] = i; });
  const collapsedPools = d.pools.filter(p => p.collapsed);
  const nearPool = pt => collapsedPools.some(p =>
    pt[0] > p.x - 12 && pt[0] < p.x + p.w + 12 && pt[1] > p.y - 12 && pt[1] < p.y + p.h + 12);

  /* edges */
  const edgeNodes = [];
  d.edges.forEach(e => {
    const isMsg = (!e.from || !e.to) && (nearPool(e.pts[0]) || nearPool(e.pts[e.pts.length - 1]));
    const g = el('g');
    const path = el('path', {
      class:'edge' + (isMsg ? ' msg' : ''),
      d:'M' + e.pts.map(p => p[0] + ',' + p[1]).join(' L'),
      'marker-end':'url(#' + (isMsg ? 'ar-msg' : 'ar') + ')' });
    g.appendChild(path);
    if (e.label){
      const mi = Math.max(1, Math.floor(e.pts.length / 2));
      const mx = (e.pts[mi - 1][0] + e.pts[mi][0]) / 2, my = (e.pts[mi - 1][1] + e.pts[mi][1]) / 2;
      const t = el('text', { class:'edge-label', x:mx + 1.5, y:my - 1.5 });
      t.textContent = e.label; g.appendChild(t);
    }
    gEdges.appendChild(g);
    const a = e.from != null ? stepOf[e.from] : undefined;
    const b = e.to != null ? stepOf[e.to] : undefined;
    const req = [a, b].filter(v => v != null);
    edgeNodes.push({ g:g, need: req.length ? Math.min.apply(null, req) : 0 });
  });

  /* nodes */
  const nodeMap = {};
  d.shapes.forEach(s => {
    const step = stepOf[s.id];
    const elm = step != null ? d.elements[step] : null;
    const kind = elm ? kindOf(elm.type) : (s.kind === 'gateway' ? 'gateway' : s.kind === 'event' ? 'start' : 'task');
    const label = (elm && elm.name) || s.label || '';
    const g = el('g', { class:'node ' + kind });
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;

    if (kind === 'gateway'){
      g.appendChild(el('path', { class:'body',
        d:'M' + cx + ',' + s.y + ' L' + (s.x + s.w) + ',' + cy + ' L' + cx + ',' + (s.y + s.h) + ' L' + s.x + ',' + cy + ' Z' }));
      const r = s.w * 0.22;
      const gl = glyphOf(elm ? elm.type : '');
      if (gl === 'and'){
        g.appendChild(el('path', { class:'glyph', d:'M' + (cx - r) + ',' + cy + ' H' + (cx + r) + ' M' + cx + ',' + (cy - r) + ' V' + (cy + r) }));
      } else {
        g.appendChild(el('path', { class:'glyph', d:'M' + (cx - r * .72) + ',' + (cy - r * .72) + ' L' + (cx + r * .72) + ',' + (cy + r * .72) +
          ' M' + (cx + r * .72) + ',' + (cy - r * .72) + ' L' + (cx - r * .72) + ',' + (cy + r * .72) }));
      }
    } else if (kind === 'start' || kind === 'end' || kind === 'intermediate' || kind === 'boundary'){
      const r = Math.min(s.w, s.h) / 2;
      g.appendChild(el('circle', { class:'body', cx:cx, cy:cy, r:r }));
      if (kind === 'intermediate' || kind === 'boundary')
        g.appendChild(el('circle', { class:'body', cx:cx, cy:cy, r:r * 0.76 }));
      const gl = glyphOf(elm ? elm.type : '');
      if (gl === 'timer'){
        g.appendChild(el('circle', { class:'glyph', cx:cx, cy:cy, r:r * 0.5 }));
        g.appendChild(el('path', { class:'glyph', d:'M' + cx + ',' + (cy - r * .34) + ' V' + cy + ' H' + (cx + r * .3) }));
      } else if (gl === 'msg'){
        const w = r * 0.9, h = r * 0.6;
        g.appendChild(el('rect', { class:'glyph', x:cx - w / 2, y:cy - h / 2, width:w, height:h }));
        g.appendChild(el('path', { class:'glyph', d:'M' + (cx - w / 2) + ',' + (cy - h / 2) + ' L' + cx + ',' + (cy + h * .16) + ' L' + (cx + w / 2) + ',' + (cy - h / 2) }));
      }
    } else {
      g.appendChild(el('rect', { class:'body', x:s.x, y:s.y, width:s.w, height:s.h, rx:Math.min(4, s.h * 0.16) }));
      if (kind === 'subprocess'){
        const b = Math.min(5, s.h * 0.2), bx = cx - b / 2, by = s.y + s.h - b - 1.5;
        g.appendChild(el('rect', { class:'glyph', x:bx, y:by, width:b, height:b }));
        g.appendChild(el('path', { class:'glyph', d:'M' + (bx + b * .22) + ',' + (by + b / 2) + ' H' + (bx + b * .78) +
          ' M' + (bx + b / 2) + ',' + (by + b * .22) + ' V' + (by + b * .78) }));
      }
    }

    /* label */
    const inBox = kind === 'task' || kind === 'subprocess';
    const boxW = inBox ? s.w - 5 : Math.max(s.w * 3.4, 40);
    const fs = inBox ? Math.max(3.9, Math.min(6.4, s.h / 4.4)) : Math.max(3.9, Math.min(5.8, s.h / 2.6));
    let lines = wrapText(label, boxW, fs, inBox ? 500 : 500);
    const maxLines = inBox ? Math.max(1, Math.floor((s.h - 4) / (fs * 1.16))) : 3;
    if (lines.length > maxLines){
      lines = lines.slice(0, maxLines);
      lines[maxLines - 1] = fitText(lines[maxLines - 1] + ' …', boxW, fs);
    }
    const startY = inBox ? cy - ((lines.length - 1) * fs * 1.16) / 2
                         : s.y + s.h + fs * 1.15;
    const t = el('text', { 'font-size':fs, 'text-anchor':'middle',
      'dominant-baseline':inBox ? 'central' : 'auto', x:cx, y:startY });
    lines.forEach((ln, i) => {
      const ts = el('tspan', { x:cx, dy:(i === 0 ? 0 : fs * 1.16) });
      ts.textContent = ln; t.appendChild(ts);
    });
    g.appendChild(t);

    gNodes.appendChild(g);
    nodeMap[s.id] = { g:g, step:step, box:s };
  });

  svg._nodes = nodeMap; svg._edges = edgeNodes; svg._stepOf = stepOf;
  return svg;
}

/* viewBox animation */
function setView(svg, r, animate){
  const cur = (svg.getAttribute('viewBox') || '').split(/[ ,]+/).map(Number);
  const to = [r.x, r.y, r.w, r.h];
  if (!animate || cur.length !== 4 || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    svg.setAttribute('viewBox', to.join(' ')); return;
  }
  if (svg._raf) cancelAnimationFrame(svg._raf);
  const t0 = performance.now(), dur = 420;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    svg.setAttribute('viewBox', to.map((v, i) => cur[i] + (v - cur[i]) * e).join(' '));
    if (k < 1) svg._raf = requestAnimationFrame(tick);
  };
  svg._raf = requestAnimationFrame(tick);
}
function focusRect(svg, box){
  const B = svg._base;
  const ar = (svg.clientWidth || 800) / (svg.clientHeight || 500);
  let w = Math.max(box.w * 4.6, B.w * 0.3), h = w / ar;
  if (h < box.h * 5) { h = box.h * 5; w = h * ar; }
  w = Math.min(w, B.w); h = Math.min(h, B.h);
  let x = box.x + box.w / 2 - w / 2, y = box.y + box.h / 2 - h / 2;
  x = Math.max(B.x, Math.min(x, B.x + B.w - w));
  y = Math.max(B.y, Math.min(y, B.y + B.h - h));
  return { x:x, y:y, w:w, h:h };
}

/* pan + zoom */
function attachPanZoom(svg){
  let drag = null;
  const vb = () => (svg.getAttribute('viewBox') || '').split(/[ ,]+/).map(Number);
  svg.addEventListener('pointerdown', ev => {
    drag = { x:ev.clientX, y:ev.clientY, v:vb() };
    svg.classList.add('drag'); svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (!drag) return;
    const sc = drag.v[2] / svg.clientWidth;
    svg.setAttribute('viewBox', [drag.v[0] - (ev.clientX - drag.x) * sc,
      drag.v[1] - (ev.clientY - drag.y) * sc, drag.v[2], drag.v[3]].join(' '));
  });
  const stop = () => { drag = null; svg.classList.remove('drag'); };
  svg.addEventListener('pointerup', stop); svg.addEventListener('pointercancel', stop);
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const v = vb(), k = ev.deltaY > 0 ? 1.14 : 1 / 1.14;
    const r = svg.getBoundingClientRect();
    const px = v[0] + (ev.clientX - r.left) / r.width * v[2];
    const py = v[1] + (ev.clientY - r.top) / r.height * v[3];
    const nw = Math.max(svg._base.w * 0.05, Math.min(svg._base.w * 1.6, v[2] * k));
    const nh = nw * (v[3] / v[2]);
    svg.setAttribute('viewBox', [px - (px - v[0]) * nw / v[2], py - (py - v[1]) * nh / v[3], nw, nh].join(' '));
  }, { passive:false });
}

/* ---------- views ---------- */
function go(patch){ Object.assign(S, patch); render(); }

function render(){
  app.innerHTML = '';
  app.appendChild(topBar());
  if (S.view === 'home') app.appendChild(homeView());
  else if (S.view === 'procs') app.appendChild(procsView());
  else if (S.view === 'closing') app.appendChild(closingView());
  else app.appendChild(playerView());
}

function topBar(){
  const bar = document.createElement('div'); bar.className = 'bar';
  const b = document.createElement('button');
  b.className = 'brand'; b.title = 'Voltar ao início';
  b.innerHTML = '<b>' + esc(U.short) + '</b><span>' + esc(U.place) + '</span>';
  b.onclick = () => go({ view:'home' });
  bar.appendChild(b);

  if (S.view === 'player' && S.dg){
    const d = D[S.dg];
    const chip = document.createElement('span'); chip.className = 'phase-chip';
    chip.textContent = d.id === 'N0' ? 'Fase 1 · Panorama' : d.id === 'N1' ? 'Fase 2 · Caminho completo' : 'Fase 3 · ' + d.id;
    bar.appendChild(chip);
    const sel = document.createElement('select'); sel.className = 'pick'; sel.id = 'pick-diagram';
    U.diagrams.forEach(x => {
      const o = document.createElement('option'); o.value = x.id; o.textContent = x.title;
      if (x.id === d.id) o.selected = true; sel.appendChild(o);
    });
    sel.onchange = () => go({ dg:sel.value, step:0 });
    bar.appendChild(sel);
  } else if (S.view === 'procs'){
    const chip = document.createElement('span'); chip.className = 'phase-chip';
    chip.textContent = 'Fase 3 · Processos'; bar.appendChild(chip);
  } else if (S.view === 'closing'){
    const chip = document.createElement('span'); chip.className = 'phase-chip';
    chip.textContent = 'Fase 4 · Fechamento'; bar.appendChild(chip);
  }

  const grow = document.createElement('div'); grow.className = 'grow'; bar.appendChild(grow);

  if (S.view === 'player'){
    const all = document.createElement('button');
    all.className = 'btn'; all.textContent = 'Ver tudo';
    all.setAttribute('aria-pressed', String(S.all)); all.id = 'btn-all';
    all.onclick = () => go({ all:!S.all });
    bar.appendChild(all);
  }
  const leg = document.createElement('button');
  leg.className = 'btn'; leg.textContent = 'Legenda'; leg.id = 'btn-legend';
  leg.onclick = showLegend; bar.appendChild(leg);

  const minus = document.createElement('button');
  minus.className = 'btn icon'; minus.textContent = 'A−'; minus.title = 'Diminuir o texto';
  minus.onclick = () => uiScale(-1); bar.appendChild(minus);
  const plus = document.createElement('button');
  plus.className = 'btn icon'; plus.textContent = 'A+'; plus.title = 'Aumentar o texto (projeção)';
  plus.onclick = () => uiScale(1); bar.appendChild(plus);
  return bar;
}
function uiScale(dir){
  S.ui = Math.max(0.85, Math.min(1.5, Math.round((S.ui + dir * 0.08) * 100) / 100));
  document.documentElement.style.setProperty('--ui', S.ui);
  try { localStorage.setItem(LS + '-ui', JSON.stringify({ ui:S.ui })); } catch (e) {}
}

    b.onclick = c.go; ph.appendChild(b);
  });
  s.appendChild(w); return s;
}

function procsView(){
  const s = document.createElement('div'); s.className = 'scroll';
  const w = document.createElement('div'); w.className = 'wrap';
  w.innerHTML = '<div class="kicker">Fase 3</div>' +
    '<h1 style="font-size:clamp(1.7rem,4vw,2.5rem)">Por dentro de cada processo</h1>' +
    '<p class="lede">Escolha o processo que o grupo vai conferir agora. O ponto colorido marca os que já têm anotações da oficina.</p>' +
    '<div class="grid" id="g"></div>';
  const g = w.querySelector('#g');
  PROCS.forEach(d => {
    const n = annCount(d.id);
    const b = document.createElement('button'); b.className = 'dcard';
    b.innerHTML = '<span class="code">' + esc(d.id) + '</span>' +
      '<b>' + esc(d.title.replace(/^.*?—\s*/, '')) + '</b>' +
      '<span class="meta">' + (n ? '<i class="dot"></i>' + n + ' anotações · ' : '') + d.elements.length + ' etapas</span>';
    b.onclick = () => go({ view:'player', dg:d.id, step:0, all:false });
    g.appendChild(b);
  });
  s.appendChild(w); return s;
}

function playerView(){
  const d = D[S.dg] || N0;
  S.step = Math.max(0, Math.min(S.step, d.elements.length - 1));
  const stage = document.createElement('div'); stage.className = 'stage';

  const cw = document.createElement('div'); cw.className = 'canvas-wrap';
  const svg = buildSvg(d); cw.appendChild(svg); attachPanZoom(svg);
  const ct = document.createElement('div'); ct.className = 'canvas-title';
  ct.textContent = d.title; cw.appendChild(ct);
  const tools = document.createElement('div'); tools.className = 'canvas-tools';
  const fit = document.createElement('button'); fit.className = 'btn'; fit.textContent = 'Tela inteira';
  fit.title = 'Ver o diagrama inteiro'; fit.onclick = () => setView(svg, svg._base, true);
  const zoom = document.createElement('button'); zoom.className = 'btn'; zoom.textContent = 'Focar etapa';
  zoom.onclick = () => focusStep(svg, d, true);
  tools.appendChild(fit); tools.appendChild(zoom); cw.appendChild(tools);
  stage.appendChild(cw);

  const side = document.createElement('div'); side.className = 'side';
  const sc = document.createElement('div'); sc.className = 'side-scroll'; sc.id = 'side-scroll';
  side.appendChild(sc); stage.appendChild(side);

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:flex;flex-direction:column;flex:1 1 auto;min-height:0';
  wrapper.appendChild(stage);
  wrapper.appendChild(railView(d, svg));

  paintStep(d, svg, sc);
  requestAnimationFrame(() => focusStep(svg, d, false));
  return wrapper;
}

function railView(d, svg){
  const r = document.createElement('div'); r.className = 'rail';
  const nav = document.createElement('div'); nav.className = 'nav';
  const prev = document.createElement('button'); prev.className = 'btn'; prev.id = 'btn-prev';
  prev.textContent = '← Voltar'; prev.onclick = () => step(-1);
  const next = document.createElement('button'); next.className = 'btn primary'; next.id = 'btn-next';
  next.textContent = 'Próxima etapa →'; next.onclick = () => step(1);
  nav.appendChild(prev); nav.appendChild(next); r.appendChild(nav);

  const ticks = document.createElement('div'); ticks.className = 'ticks'; ticks.id = 'ticks';
  const starts = {}; flowsOf(d).forEach(f => starts[f.from] = true);
  d.elements.forEach((e, i) => {
    const t = document.createElement('button'); t.className = 'tick'; t.dataset.i = i;
    t.title = (i + 1) + '. ' + e.name;
    if (i > 0 && starts[i]) t.classList.add('flowstart');
    t.onclick = () => go({ step:i });
    ticks.appendChild(t);
  });
  r.appendChild(ticks);
  const c = document.createElement('span'); c.className = 'count'; c.id = 'count'; r.appendChild(c);
  return r;
}

function step(dir){
  const d = D[S.dg];
  const n = Math.max(0, Math.min(d.elements.length - 1, S.step + dir));
  if (n === S.step) return;
  S.step = n;
  const svg = app.querySelector('svg.diagram');
  paintStep(d, svg, app.querySelector('#side-scroll'));
  focusStep(svg, d, true);
}

function focusStep(svg, d, animate){
  const e = d.elements[S.step];
  const nd = e && e.shape ? svg._nodes[e.shape] : null;
  if (S.all || !nd) { setView(svg, svg._base, animate); return; }
  setView(svg, focusRect(svg, nd.box), animate);
}

function paintStep(d, svg, sc){
  /* diagram state */
  for (const id in svg._nodes){
    const n = svg._nodes[id];
    const revealed = S.all || (n.step != null && n.step <= S.step);
    n.g.classList.toggle('dim', !revealed);
    n.g.classList.toggle('cur', n.step === S.step);
  }
  svg._edges.forEach(e => e.g.classList.toggle('dim', !(S.all || e.need <= S.step)));
  const halo = svg.querySelector('.halo'); if (halo) halo.remove();

  /* rail */
  const ticks = app.querySelector('#ticks');
  if (ticks) Array.from(ticks.children).forEach((t, i) => {
    const m = getNote(d.id, i).mark;
    t.className = 'tick' + (t.classList.contains('flowstart') ? ' flowstart' : '') +
      (i === S.step ? ' cur' : i < S.step ? ' done' : '') + (m ? ' ' + m : '');
  });
  const cnt = app.querySelector('#count');
  if (cnt) cnt.textContent = (S.step + 1) + ' / ' + d.elements.length;
  const p = app.querySelector('#btn-prev'), nx = app.querySelector('#btn-next');
  if (p) p.disabled = S.step === 0;
  if (nx) nx.textContent = S.step === d.elements.length - 1 ? 'Concluir ✓' : 'Próxima etapa →';
  if (nx) nx.onclick = () => S.step === d.elements.length - 1 ? go({ view:'closing' }) : step(1);

  /* card */
  const e = d.elements[S.step];
  const kind = kindOf(e.type);
  const note = getNote(d.id, S.step);
  const flow = flowsOf(d).find(f => f.idx.indexOf(S.step) >= 0);
  const dec = kind === 'gateway' ? (d.decisions || []).find(x => x.name === e.name) : null;
  const msgs = (d.messages || []).filter(m => m.from === e.name || m.to === e.name);

  sc.innerHTML =
    '<span class="lane-tag"><i style="background:' + laneColor(d, e.lane) + '"></i>' + esc(e.lane || d.pool) + '</span>' +
    '<div class="step-head"><span class="step-n">Etapa ' + (S.step + 1) + ' de ' + d.elements.length + '</span>' +
      '<span class="kind ' + kind + '">' + esc(kindWord[kind] || kind) + '</span>' +
      (flow && flow.from !== 0 ? '<span class="step-n">fluxo: ' + esc(flow.name) + '</span>' : '') + '</div>' +
    '<h2 class="step-title">' + esc(e.name) + '</h2>' +
    '<p class="step-doc' + (e.doc && e.doc !== '—' ? '' : ' empty') + '">' +
      esc(e.doc && e.doc !== '—' ? e.doc : 'Sem detalhamento no estudo — boa oportunidade para o grupo descrever como isso acontece.') + '</p>' +
    (dec ? '<div class="branches">' + dec.paths.map(pp =>
      '<div class="branch"><b>' + esc(pp.label) + '</b><span>' + esc(pp.target) + '</span></div>').join('') + '</div>' : '') +
    (msgs.length ? '<div class="msgs">' + msgs.map(m =>
      '<div class="msg"><b>' + (m.from === e.name ? 'envia →' : '← recebe') + '</b><span>' +
      esc(m.msg) + ' <span style="color:var(--ink-3)">(' + esc(m.from === e.name ? m.to : m.from) + ')</span></span></div>').join('') + '</div>' : '') +
    '<div class="block-label">Conferindo com o grupo</div>' +
    '<div class="marks">' +
      '<button class="mark ok" data-m="ok" aria-pressed="' + (note.mark === 'ok') + '">✓ Confere</button>' +
      '<button class="mark warn" data-m="warn" aria-pressed="' + (note.mark === 'warn') + '">⚠ Precisa ajustar</button>' +
      '<button class="mark bad" data-m="bad" aria-pressed="' + (note.mark === 'bad') + '">✕ Não é assim</button>' +
    '</div>' +
    '<div class="field"><label for="f-quem">Quem faz isso aqui hoje?</label>' +
      '<textarea id="f-quem" placeholder="nome, função ou grupo responsável">' + esc(note.quem || '') + '</textarea></div>' +
    '<div class="field"><label for="f-obs">Como acontece na prática — ajustes e dúvidas</label>' +
      '<textarea id="f-obs" placeholder="o que muda, o que falta, o que trava">' + esc(note.obs || '') + '</textarea></div>';

  sc.querySelectorAll('.mark').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    setNote(d.id, S.step, { mark: getNote(d.id, S.step).mark === m ? null : m });
    paintStep(d, svg, sc);
  });
  const q = sc.querySelector('#f-quem'), o = sc.querySelector('#f-obs');
  q.oninput = () => setNote(d.id, S.step, { quem:q.value });
  o.oninput = () => setNote(d.id, S.step, { obs:o.value });
  sc.scrollTop = 0;
}

/* ---------- closing ---------- */
function collect(){
  const out = [];
  U.diagrams.forEach(d => d.elements.forEach((e, i) => {
    const n = getNote(d.id, i);
    if (n.mark || (n.quem || '').trim() || (n.obs || '').trim())
      out.push({ d:d, i:i, e:e, n:n });
  }));
  return out;
}
function closingView(){
  const s = document.createElement('div'); s.className = 'scroll';
  const w = document.createElement('div'); w.className = 'wrap';
  const items = collect();
  const byD = {};
  items.forEach(it => { (byD[it.d.id] = byD[it.d.id] || []).push(it); });
  const tally = { ok:0, warn:0, bad:0 };
  items.forEach(it => { if (it.n.mark) tally[it.n.mark]++; });

  let html = '<div class="kicker">Fase 4</div>' +
    '<h1 style="font-size:clamp(1.7rem,4vw,2.5rem)">O que o grupo ajustou</h1>' +
    '<p class="lede">Tudo que foi marcado e anotado durante a oficina, em ordem. Copie e leve para a revisão do modelo.</p>' +
    '<div class="facts" style="margin-bottom:22px">' +
      '<span>✓ ' + tally.ok + ' confere</span><span>⚠ ' + tally.warn + ' ajustar</span>' +
      '<span>✕ ' + tally.bad + ' não é assim</span><span>' + items.length + ' etapas anotadas</span></div>';
  if (!items.length){
    html += '<div class="empty-state">Nenhuma anotação ainda. Volte para uma fase, marque as etapas com o grupo e elas aparecem aqui.</div>';
  } else {
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">' +
      '<button class="btn primary" id="copy">Copiar tudo</button>' +
      '<button class="btn" id="clear">Limpar anotações</button></div>';
    for (const id in byD){
      const d = D[id];
      html += '<h2 class="sec">' + esc(d.title) + '</h2>';
      byD[id].forEach(it => {
        html += '<div class="note-card"><h4>' + esc(it.e.name) + '</h4>' +
          '<div class="src">etapa ' + (it.i + 1) + ' · ' + esc(it.e.lane) + '</div>' +
          (it.n.mark ? '<span class="pill ' + it.n.mark + '">' +
            ({ ok:'✓ confere', warn:'⚠ precisa ajustar', bad:'✕ não é assim' }[it.n.mark]) + '</span>' : '') +
          '<dl>' + (it.n.quem ? '<dt>Quem faz</dt><dd>' + esc(it.n.quem) + '</dd>' : '') +
          (it.n.obs ? '<dt>Na prática</dt><dd>' + esc(it.n.obs) + '</dd>' : '') + '</dl></div>';
      });
    }
  }
  w.innerHTML = html;
  const cp = w.querySelector('#copy');
  if (cp) cp.onclick = () => {
    let md = '# Oficina ' + U.short + '\n\n';
    for (const id in byD){
      md += '## ' + D[id].title + '\n\n';
      byD[id].forEach(it => {
        md += '- **' + it.e.name + '** (etapa ' + (it.i + 1) + ', ' + it.e.lane + ')\n';
        if (it.n.mark) md += '  - marcação: ' + ({ ok:'confere', warn:'precisa ajustar', bad:'não é assim' }[it.n.mark]) + '\n';
        if (it.n.quem) md += '  - quem faz: ' + it.n.quem + '\n';
        if (it.n.obs) md += '  - na prática: ' + it.n.obs + '\n';
      });
      md += '\n';
    }
    navigator.clipboard.writeText(md).then(
      () => { cp.textContent = 'Copiado ✓'; setTimeout(() => cp.textContent = 'Copiar tudo', 1800); },
      () => { cp.textContent = 'Não deu — selecione o texto'; });
  };
  const cl = w.querySelector('#clear');
  if (cl) cl.onclick = () => {
    if (cl.dataset.armed){ notes = {}; save(); render(); }
    else { cl.dataset.armed = '1'; cl.textContent = 'Confirmar: apagar tudo'; }
  };
  s.appendChild(w); return s;
}

/* ---------- legend ---------- */
function showLegend(){
  const veil = document.createElement('div'); veil.className = 'veil';
  const m = document.createElement('div'); m.className = 'modal';
  const S1 = (inner) => '<svg viewBox="0 0 52 30" width="52" height="30">' + inner + '</svg>';
  m.innerHTML = '<h3>Como ler o desenho</h3>' +
    '<p style="color:var(--ink-2);margin:0">O desenho é a planta do processo. Cada figura quer dizer uma coisa:</p>' +
    '<div class="leg">' +
      '<div>' + S1('<rect x="4" y="7" width="44" height="17" rx="3" fill="var(--surface)" stroke="var(--line-2)"/>') + '</div>' +
      '<p><b>Caixa</b> — uma tarefa: alguém faz alguma coisa.</p>' +
      '<div>' + S1('<rect x="4" y="7" width="44" height="17" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/><rect x="22" y="17" width="6" height="6" fill="none" stroke="var(--ink-2)"/>') + '</div>' +
      '<p><b>Caixa com +</b> — um processo inteiro guardado ali dentro; tem um diagrama só para ele.</p>' +
      '<div>' + S1('<path d="M26,4 L40,15 L26,26 L12,15 Z" fill="var(--surface)" stroke="var(--gate)" stroke-width="1.4"/><path d="M22,11 L30,19 M30,11 L22,19" stroke="var(--ink-2)"/>') + '</div>' +
      '<p><b>Losango</b> — uma decisão: o caminho se abre em sim e não.</p>' +
      '<div>' + S1('<circle cx="16" cy="15" r="9" fill="none" stroke="var(--start)" stroke-width="1.6"/><circle cx="38" cy="15" r="9" fill="none" stroke="var(--end)" stroke-width="2.8"/>') + '</div>' +
      '<p><b>Círculos</b> — começo (linha fina) e fim (linha grossa) do fluxo.</p>' +
      '<div>' + S1('<path d="M4,15 H44" stroke="var(--ink-3)" stroke-width="1.4"/><path d="M40,11 L47,15 L40,19 z" fill="var(--ink-3)"/>') + '</div>' +
      '<p><b>Seta cheia</b> — a ordem: o que vem depois do quê.</p>' +
      '<div>' + S1('<path d="M4,15 H44" stroke="var(--ext)" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M40,11 L47,15 L40,19 z" fill="var(--ext)"/>') + '</div>' +
      '<p><b>Seta tracejada</b> — conversa com quem está de fora: fornecedor, cliente, órgão ambiental.</p>' +
      '<div style="font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-2);writing-mode:vertical-rl;transform:rotate(180deg);background:var(--surface-3);border:1px solid var(--line-2);border-radius:3px;padding:4px;text-align:center">raia</div>' +
      '<p><b>Faixa horizontal (raia)</b> — quem é responsável: tudo que está naquela faixa é feito por aquela pessoa ou equipe.</p>' +
    '</div>' +
    '<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn primary" id="lclose">Entendi</button></div>' +
    '<p style="color:var(--ink-3);font-size:.88em;margin-top:14px">Atalhos: setas ← → ou barra de espaço para andar; <b>T</b> para ver o diagrama inteiro; <b>Esc</b> fecha.</p>';
  veil.appendChild(m); document.body.appendChild(veil);
  const close = () => veil.remove();
  m.querySelector('#lclose').onclick = close;
  veil.onclick = ev => { if (ev.target === veil) close(); };
  m.querySelector('#lclose').focus();
}

/* ---------- keys ---------- */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ const v = document.querySelector('.veil'); if (v) v.remove(); return; }
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select') return;
  if (S.view !== 'player') return;
  if (ev.key === 'ArrowRight' || ev.key === ' '){ ev.preventDefault(); step(1); }
  else if (ev.key === 'ArrowLeft'){ ev.preventDefault(); step(-1); }
  else if (ev.key === 't' || ev.key === 'T'){ go({ all:!S.all }); }
});

/* ---------- boot ---------- */
function start(snap){
  if (snap && snap.view) Object.assign(S, snap);
  render();
}
if (window.claude && window.claude.hot){
  window.claude.hot.snapshot(() => ({ view:S.view, dg:S.dg, step:S.step, all:S.all, ui:S.ui }));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data || {});
} else start({});
})();
</script>

</body>
